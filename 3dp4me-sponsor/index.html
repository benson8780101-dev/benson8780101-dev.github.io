<!doctype html>
<!-- 預覽用：在電腦上打開就能看 6 種語言的樣子。真正放進網站的是 section.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>3DP4ME Sponsor Section (Draft)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#fff;font-family:Montserrat,Arial,sans-serif}
  .bar{display:flex;gap:8px;justify-content:center;padding:12px;background:#2f2e62;flex-wrap:wrap}
  .bar button{font:600 14px Montserrat,Arial;padding:6px 14px;border:0;border-radius:4px;cursor:pointer;background:#fff;color:#2f2e62}
  .bar button.on{background:#3a54c0;color:#fff}
  .note{text-align:center;font-size:13px;color:#666;padding:8px}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<p class="note">Draft for internal review · Not the official 3DP4ME website. Choose a language above.</p>
<div id="slot"></div>

<script>
// 各語言文字：英文是原文，其他是建議翻譯（給 Weglot 校對用）
const T = {
  en:{name:"English",dir:"ltr",h:"Help a Kid to Walk and Play Again!",
    p:"We provide each patient with a custom 3D printed prosthesis, which includes physical therapy, psychosocial support, and home visits to check maintenance requests.",
    v:[["Freedom","Going where they want to go, on their own."],["Hope","Daring to dream about the future again."],["Belonging","Back with family, friends, and community."],["Confidence","Standing tall and believing in themselves."]],
    b:"Donate",u:"/donate"},
  de:{name:"Deutsch",dir:"ltr",h:"Helfen Sie einem Kind, wieder zu laufen und zu spielen!",
    p:"Wir versorgen jeden Patienten mit einer individuell angefertigten Prothese aus dem 3D-Drucker. Dazu gehören Physiotherapie, psychosoziale Unterstützung und Hausbesuche, bei denen wir Wartungsanfragen prüfen.",
    v:[["Freiheit","Selbst dorthin gehen, wohin sie möchten."],["Hoffnung","Wieder von der Zukunft träumen."],["Zugehörigkeit","Wieder mitten in Familie, Freundeskreis und Gemeinschaft."],["Selbstvertrauen","Aufrecht stehen und an sich selbst glauben."]],
    b:"Spenden",u:"/de/donate/"},
  ar:{name:"العربية",dir:"rtl",h:"ساعد طفلاً على المشي واللعب من جديد!",
    p:"نوفّر لكل مريض طرفًا اصطناعيًا مصممًا خصيصًا له ومطبوعًا بتقنية الطباعة ثلاثية الأبعاد، ويشمل ذلك العلاج الطبيعي والدعم النفسي والاجتماعي والزيارات المنزلية لمتابعة طلبات الصيانة.",
    v:[["الحرية","يذهبون إلى حيث يريدون، بأنفسهم."],["الأمل","يجرؤون على الحلم بالمستقبل من جديد."],["الانتماء","يعودون إلى عائلاتهم وأصدقائهم ومجتمعهم."],["الثقة","يقفون بثبات ويؤمنون بأنفسهم."]],
    b:"تبرّع",u:"/ar/donate/"},
  zh:{name:"简体中文",dir:"ltr",h:"帮助孩子重新行走、尽情玩耍！",
    p:"我们为每位患者量身打造3D打印义肢，并提供物理治疗、心理社会支持，以及上门家访，跟进义肢的维修需求。",
    v:[["自由","想去哪里，就能自己走去。"],["希望","重新敢于梦想未来。"],["归属","重新回到家人、朋友和社区之中。"],["自信","抬头挺胸，相信自己。"]],
    b:"捐款",u:"/zh/donate/"},
  es:{name:"Español",dir:"ltr",h:"¡Ayuda a un niño a volver a caminar y jugar!",
    p:"Proporcionamos a cada paciente una prótesis personalizada impresa en 3D, que incluye fisioterapia, apoyo psicosocial y visitas a domicilio para atender las solicitudes de mantenimiento.",
    v:[["Libertad","Ir a donde quieran, por sí mismos."],["Esperanza","Atreverse a soñar de nuevo con el futuro."],["Pertenencia","De vuelta con su familia, sus amigos y su comunidad."],["Confianza","Mantenerse firmes y creer en sí mismos."]],
    b:"Donar",u:"/es/donate/"},
  fr:{name:"Français",dir:"ltr",h:"Aidez un enfant à marcher et à jouer de nouveau !",
    p:"Nous fournissons à chaque patient une prothèse sur mesure imprimée en 3D, accompagnée de kinésithérapie, d’un soutien psychosocial et de visites à domicile pour suivre les demandes d’entretien.",
    v:[["Liberté","Aller où ils veulent, par eux-mêmes."],["Espoir","Oser rêver à nouveau de l’avenir."],["Appartenance","Retrouver leur famille, leurs amis et leur communauté."],["Confiance","Se tenir droit et croire en soi."]],
    b:"Faire un don",u:"/fr/donate/"}
};
const IMG=["images/freedom.jpg","images/hope.jpg","images/belonging.jpg","images/confidence.jpg"];
let template="";

// 用 textContent 填字，不直接拼 HTML（避免網頁注入）
function render(lang){
  const t=T[lang], slot=document.getElementById("slot");
  slot.innerHTML=template;
  const s=slot.querySelector(".k3d-impact");
  s.dir=t.dir; s.lang=lang;
  s.querySelector("h2").textContent=t.h;
  s.querySelector(".k3d-lead").textContent=t.p;
  s.querySelectorAll(".k3d-card").forEach((c,i)=>{
    c.querySelector("img").src=IMG[i];
    c.querySelector(".k3d-word").textContent=t.v[i][0];
    c.querySelector(".k3d-text").textContent=t.v[i][1];
  });
  const btn=s.querySelector(".k3d-btn");
  btn.lastChild.textContent=" "+t.b;
  btn.href="https://3dp4me.org"+t.u;
  document.querySelectorAll(".bar button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
}

const bar=document.getElementById("bar");
Object.keys(T).forEach(l=>{
  const b=document.createElement("button");
  b.textContent=T[l].name; b.dataset.l=l; b.onclick=()=>render(l); bar.appendChild(b);
});

fetch("section.html").then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(html=>{ template=html; render("en"); })
  .catch(err=>{
    // 直接雙擊打開時，有些瀏覽器不准讀旁邊的檔案，就顯示內嵌版本
    template=document.getElementById("fallback").innerHTML; render("en");
    console.warn("section.html not loaded, using embedded copy:", err);
  });
</script>
<template id="fallback"><!--
  3DP4ME – "Help a Kid to Walk and Play Again!" section
  For: Sponsor a Child page (https://3dp4me.org/sponsor/)

  HOW TO USE (WordPress):
  1. Upload the 4 photos in /images to the Media Library.
  2. Replace the 4 src="images/....jpg" below with their Media Library URLs.
  3. Paste this whole block into a "Custom HTML" block on the page.
  The site's translator (Weglot) will pick up the text for DE / AR / ZH / ES / FR.
  Suggested translations are in For_Web_Designer.md.

  All CSS is scoped under .k3d-impact so it won't affect the rest of the page.
-->
<section class="k3d-impact">
  <style>
    .k3d-impact{--navy:#2f2e62;--blue:#3a54c0;--bg:#edecf2;--card:#fff;--line:#dcdbe6;
      background:var(--bg);padding:56px 20px 64px;text-align:center;
      font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;color:var(--navy)}
    .k3d-impact *{box-sizing:border-box}
    .k3d-impact h2{margin:0 auto 16px;max-width:900px;font-size:clamp(28px,4vw,44px);
      font-weight:600;line-height:1.2;color:var(--navy)}
    .k3d-impact .k3d-lead{margin:0 auto 40px;max-width:960px;font-size:clamp(18px,2.2vw,26px);
      font-weight:600;line-height:1.35;color:var(--navy)}
    .k3d-impact .k3d-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;
      max-width:1200px;margin:0 auto 40px;padding:0;list-style:none}
    .k3d-impact .k3d-card{background:var(--card);border:1px solid var(--line);border-radius:6px;
      overflow:hidden;display:flex;flex-direction:column}
    .k3d-impact .k3d-card img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}
    .k3d-impact .k3d-body{padding:20px 18px 24px}
    .k3d-impact .k3d-word{margin:0 0 8px;font-size:26px;font-weight:700;color:var(--navy)}
    .k3d-impact .k3d-text{margin:0;font-size:16px;line-height:1.5;color:#4a4970}
    .k3d-impact .k3d-btn{display:inline-flex;align-items:center;gap:10px;background:var(--blue);
      color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:14px 28px;border-radius:6px}
    .k3d-impact .k3d-btn:hover{filter:brightness(1.1)}
    .k3d-impact .k3d-btn svg{width:22px;height:22px;fill:#fff}
    @media (max-width:960px){.k3d-impact .k3d-grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:520px){.k3d-impact .k3d-grid{grid-template-columns:1fr;max-width:380px}}
  </style>

  <h2>Help a Kid to Walk and Play Again!</h2>
  <p class="k3d-lead">We provide each patient with a custom 3D printed prosthesis, which includes physical therapy, psychosocial support, and home visits to check maintenance requests.</p>

  <ul class="k3d-grid">
    <li class="k3d-card">
      <img src="images/freedom.jpg" alt="A boy kicks a soccer ball outdoors with his prosthetic leg" loading="lazy" width="800" height="1000">
      <div class="k3d-body">
        <h3 class="k3d-word">Freedom</h3>
        <p class="k3d-text">Going where they want to go, on their own.</p>
      </div>
    </li>
    <li class="k3d-card">
      <img src="images/hope.jpg" alt="A child stands tall on two new prosthetic legs" loading="lazy" width="800" height="1000">
      <div class="k3d-body">
        <h3 class="k3d-word">Hope</h3>
        <p class="k3d-text">Daring to dream about the future again.</p>
      </div>
    </li>
    <li class="k3d-card">
      <img src="images/belonging.jpg" alt="A toddler takes steps holding her parents' hands" loading="lazy" width="800" height="1000">
      <div class="k3d-body">
        <h3 class="k3d-word">Belonging</h3>
        <p class="k3d-text">Back with family, friends, and community.</p>
      </div>
    </li>
    <li class="k3d-card">
      <img src="images/confidence.jpg" alt="A smiling girl gives a thumbs-up on her new prosthetic leg" loading="lazy" width="800" height="1000">
      <div class="k3d-body">
        <h3 class="k3d-word">Confidence</h3>
        <p class="k3d-text">Standing tall and believing in themselves.</p>
      </div>
    </li>
  </ul>

  <a class="k3d-btn" href="/donate">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.4C.4 8.3 2.3 4 6.4 4c2.3 0 4 1.3 5.6 3.3C13.6 5.3 15.3 4 17.6 4c4.1 0 6 4.3 4.4 7.6C19.5 16.4 12 21 12 21z"/></svg>
    Donate
  </a>
</section>
</template>
</body>
</html>
