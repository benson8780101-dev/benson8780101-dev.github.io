# 開始之前

**Claude Code 不只是寫程式，它是一個能「動手幫你做事」的 AI 助理**：讀檔案、上網查資料、看你的 Gmail 和行事曆、做出網頁小工具。

- **最難的是一開始的設定。** 設定一次，之後一直能用。這份指南帶你把設定一次走完。
- **你不用會寫程式。** 遇到不會的，就把問題（甚至這個網頁的內容）丟給 Claude，叫它「直接幫我做」。
- 標著 💬 的框框是**可以直接複製貼給 Claude 的話**，按右上角的「複製」就好。

## 建議的學習路線

| 天 | 做什麼 |
|---|---|
| 第 1 天 | 讀「觀念」→ 照「安裝與設定」裝好 Claude Code、cmux、CLAUDE.md、安全三件套 |
| 第 2 天 | 照「工具清單」裝 Firecrawl、Playwright，讓 AI 會上網 |
| 第 3 天 | 照「實戰練習」做每日早報（接 Gmail、行事曆、Notion） |
| 第 4–5 天 | 做一個自己的小工具（報價單、記帳表、食譜卡⋯⋯） |
| 之後 | 每天花 15 分鐘「教」它一件事，一週後就很像你的私人助理 |

## 三句最重要的話

- 🍼 **當個「巨嬰」**：不會就問 Claude，叫它「直接幫我做」，不要自己去 Google 翻半天。
- 🧑‍🏫 **把它當新同事**：第一次做不好很正常，給它第二次機會、講清楚一點。
- 🛡️ **安全先裝好**：先裝「防誤刪」，再讓它大展身手。

AI 工具更新很快（本頁整理於 2026 年 10 月），價格和指令以官網為準。

# 觀念入門

**Claude Code（簡稱 CC）＝住在你電腦裡、有手有腳的 AI 助理。** 它不只回答問題，還能真的去讀你的檔案、上網、操作工具、做出網頁小程式。

## AI 的三個階段

| 階段 | 比喻 | 能做什麼 | 例子 |
|---|---|---|---|
| **Chat 聊天** | 沒有手腳的圖書館 | 你問、它答；懂很多，但不能動手 | ChatGPT、Gemini、Claude 網頁版 |
| **Cowork 協作** | 外包整理師 | 有一點權限：整理資料夾、讀 Gmail、整理 Excel | Claude 桌面版的 Cowork |
| **Code 程式** | 貼身管家（自帶工程、設計、內容團隊） | 你描述、它創造；記得你、會用你給它的所有工具 | **Claude Code** |

以前用 GPTs、Gems：「這個對話框是寫文章助手、那個是旅遊助手」，**換一個對話框它就失憶**。Claude Code 把所有工具和技能裝在**同一個助理**身上，你只要跟它講話，它自己判斷要用什麼。

## 三大優勢

1. **深度了解你**：你的偏好、習慣、資料存在你自己的電腦裡（一個叫 `CLAUDE.md` 的檔案），每次對話它都會先讀。
2. **工具箱無限**：把「鑰匙」（API Key、MCP 外掛）交給它，它就能進你的 Gmail、Notion、WordPress 幫你做事。
3. **用你的方法做事**：把常做的事寫成 SOP（叫做 **Skill 技能**），它下次就照你的方法做。

## 名詞小字典

| 名詞 | 白話解釋 |
|---|---|
| **終端機** | 電腦內建、黑底白字、用打字下指令的視窗。裝好 cmux 後就像聊天 App。 |
| **CLAUDE.md** | 給 Claude 看的「我的使用說明書」：我是誰、怎麼跟我溝通、有哪些規則。 |
| **MCP** | AI 的「外接插座」。接上某個工具的 MCP，AI 就能操作那個工具。 |
| **API Key／Token** | 某個服務發給你的「鑰匙」。**像密碼一樣保管**。 |
| **Skill 技能** | 寫給 AI 的「任務 SOP 小卡」。 |
| **/ 指令** | 在對話框打 `/` 開頭的快捷指令，例如 `/mcp`、`/config`。 |
| **Vibe Coding** | 不寫程式碼，只用「講需求」的方式讓 AI 做出軟體。 |
| **開源** | 程式碼公開，大家可以檢查和改良，通常免費。透明、社群一起維護、不怕公司倒掉。 |
| **部署** | 把電腦上的小工具放上網路，變成別人也能打開的網址。 |
| **上下文** | AI 一次能「記在腦中」的對話量。快滿了它會變笨，要用 `/compact` 整理。 |

## 學習時的心態

**1. 願意「暫時變差」。** 就像從看鍵盤打字改成盲打，一開始會變慢，習慣後快兩三倍。從 ChatGPT 換到終端機，前幾天卡卡的是正常的。

**2. 當個「巨嬰」。** 遇到不會的，第一反應是問 Claude，不是自己去 Google。它叫你「把這行貼到終端機」時，回它：「**你直接幫我做**」。

**3. 把它當聰明但剛報到的新同事。** 第一次做錯不要放棄，給它第二次機會、換個方法。需求要講清楚，**像好老闆一樣，不要讓人家猜**。前期給它工具、權限、規則是一次性的投資。

**4. 不要想一次到位。** 正確的節奏：描述功能 → Claude 做好 → 你自己試 → 有問題就截圖貼給它 → 它修正 → 再描述下一個功能。

## 要花多少錢？

- Claude Code **需要付費方案**（免費帳號只能用網頁版聊天）。建議從 **Pro（每月約 20 美元）** 開始，不夠再升級 Max。
- 登入時選「用訂閱帳號」，**不要選「用多少付多少（API 計費）」**，那個可能燒很多錢。
- 大部分外掛免費或有免費額度。價格以 claude.com 為準。

# 安裝與設定

> 以 **Mac** 示範，Windows 的差異標 🪟。裝好 Claude 之後，後面的步驟幾乎都可以貼一句話叫它幫你做。

| # | 做什麼 | 目的 |
|---|---|---|
| 1 | 到正牌官網註冊、付費 | 避開釣魚網站 |
| 2 | 安裝 Claude Code | 主角 |
| 3 | 安裝 cmux 終端機 | 終端機變得像聊天 App |
| 4 | 建立專案資料夾 | 讓 AI 有自己的工作桌 |
| 5 | 建立 CLAUDE.md | 每次對話都懂你 |
| 6 | cc 快捷鍵＋全螢幕模式 | 打兩個字開工、畫面不閃 |
| 7 | 安全三件套＋權限模式 | 防誤刪、少跳視窗 |
| 8 | 長文編輯器 CotEditor | 長段文字不再擠成一行 |

## 第 1 步：註冊帳號（小心釣魚網站）

⚠️ Google 搜尋「Claude Code」時，**標「贊助商」的結果千萬不要點**。有仿冒網站做得一模一樣，下載的是惡意程式。只認：`claude.ai`、`claude.com`、`code.claude.com`、`anthropic.com`。

到 [claude.ai](https://claude.ai) 註冊，升級到 **Pro 方案**。

## 第 2 步：安裝 Claude Code

1. 打開 [官方說明頁](https://code.claude.com/docs/zh-TW/overview)，找到「Native Install」。
2. 打開終端機：按 `⌘ + 空白鍵` → 打「終端機」→ Enter。
3. 貼上官網的安裝指令（目前是 `curl -fsSL https://claude.ai/install.sh | bash`，以官網為準）→ Enter。
4. 裝完輸入 `claude` → Enter。

**卡關：** 出現「command not found」→ 往上捲，安裝訊息裡有一段 **Setup Notes** 叫你再執行一行指令，照著做就好。

**第一次啟動：** 選畫面風格 → 登入方式選**第一個（訂閱帳號）** → 瀏覽器確認帳號、按授權 → 信任資料夾。看到輸入框就成功了，打「你好，你能做什麼？」試試看。

🪟 Windows：官網有 PowerShell 的安裝指令。也可以用 **Claude 桌面版 App** 的 Code 分頁，滑鼠操作更直覺（第 3、6 步可跳過）。

## 第 3 步：安裝 cmux（讓終端機變好用）

Mac 內建終端機很難用：按 `Shift+Enter` 想換行卻直接送出，滑鼠點不到想改的字。[cmux](https://cmux.com/zh-TW)（開源、免費）解決這些問題：

- `Shift + Enter` 換行
- `⌘ + T` 開新分頁，**同時讓好幾個 Claude 做不同的事**
- 拖曳分頁可以分割視窗、左右並排

安裝：下載 Mac 版 → 拖進「應用程式」→ 打開 cmux → 輸入 `claude`。

🪟 Windows：cmux 不支援，可用內建的 Windows Terminal、[WMUX](https://github.com/amirlehmam/wmux)（Windows 版 cmux）或 [Tabby](https://tabby.sh/)（開源）。

## 第 4 步：建立專案資料夾

**不要在電腦最外層開 Claude Code**，給它一張自己的工作桌：在「下載」或「文件」裡新建資料夾（例如 `我的 AI Agent`），選取後按 `⌘ + Option + C` 複製路徑。

> 💬 我想把工作資料夾設在（貼上路徑），請幫我移動過去，之後的工作都在這裡進行。

小技巧：直接把**資料夾或圖片拖進終端機**，就會貼上路徑。

## 第 5 步：建立 CLAUDE.md，讓它記住你

`CLAUDE.md` 放在專案資料夾裡，**每次開新對話 Claude 都會先讀**。

**方法 A：從舊 AI 搬家。** 先把這段貼給你以前常用的 AI（ChatGPT 或 Gemini）：

> 💬 請把你所知道關於我的一切整理成一份文件：我的身分、工作、家庭、興趣、溝通偏好、常做的事、重要的規則和習慣。用條列方式，讓我可以交給另一個 AI 助理。

再把它的回答貼給 Claude：

> 💬 這是我在其他 AI 累積的個人資料，請幫我建立 CLAUDE.md 記住我的偏好：（貼上）

**方法 B：讓它訪問你。**

> 💬 幫我建立一個 CLAUDE.md 記住我的偏好。請一題一題問我需要的資訊。

**範本（可以照抄再改）：**

```
# 我的工作偏好
- 我是（名字），住在（城市），職業是（⋯⋯）。
- 一律用繁體中文回答，白話、親切，少用專業術語；真的要用就解釋一句。
- 先講結論，再講原因。
- 我不是工程師，請用比喻和白話引導我。
- 執行重要動作前，先給我簡短的計畫，等我確認再做。
- 不確定或有更好的方法時，上網查過後直接建議。
- 時間一律用（例如 Asia/Taipei）；處理日期前先確認今天是幾號。
```

**測試：** 按 `⌘ + T` 開新對話，問「我是誰？我平常做什麼？」。以後它學到新東西，記得說「**把這個寫進 CLAUDE.md**」，它偶爾會忘記寫。

## 第 7 步：安全三件套＋權限模式

Claude 每個動作都問「可以嗎？」很煩，但全部放行又怕誤刪。**先裝安全網，再放寬權限：**

1. 🗑️ **刪檔先進廢紙簍**：誤刪都能救回來。
2. 🚫 **危險指令黑名單**：擋掉「一執行就回不來」的指令。
3. 🧠 **工作守則**：被擋下時要回頭問你，不能繞過。

> 💬 我是 AI 與程式的新手。請判斷我的電腦系統，幫我安裝這份「AI 安全三件套」：https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/02-safety-kit.md 照文件的 AI 執行指引直接幫我裝好，用白話跟我說，每次改設定檔前先備份。

| 模式 | 白話 | 適合誰 |
|---|---|---|
| **Default** | 每個動作都先問 | 剛入門、想看清楚它在做什麼 |
| **Plan** | 只想不動手，你同意才做 | 大工程前先看全貌 |
| **Accept Edits** | 改檔案不問，跑指令會問 | 寫程式為主 |
| **Auto** | 它自己判斷，危險的才問 | **大多數新手首選** |
| **Bypass** | 什麼都不問 | 很清楚自己在做什麼的人 |

按 `Shift + Tab` 切換模式；打 `/config` 看所有設定（包含模型）。Pro 方案想省額度可以選比較省的模型，要最聰明就選最強的，不確定選 Default。

## 基礎環境

**Claude Code** — Anthropic 做的 AI 助理，能讀寫檔案、執行指令、上網、接外掛。資料在你自己電腦上，越用越懂你。用得更好：一個主題開一個對話；記憶快滿打 `/compact`；常用 `/mcp`、`/config`、`Shift+Tab`（切換權限）、`Esc`（打斷它）。

**cmux** ✓開源 — 以 Ghostty 為核心、為 AI 設計的終端機。用得更好：一個分頁做早報、一個做網頁、一個查資料，同時進行；把分頁拖到一側就能左右並排。

**cc＋全螢幕模式** — `cc`＝進專案資料夾＋打開 Claude。注意：全螢幕模式下 `⌘+F` 失效，改用 `Ctrl+O` 再按 `/`。

**CotEditor** ✓開源 — Mac 上輕巧的純文字編輯器。在 Claude 裡叫出來寫長文，表情符號和換行都會保留。

## MCP 外掛：讓 AI 長出手腳

**MCP＝AI 的外接插座。** 安全原則：第一次先開最小權限，**能只讀就先只讀**。裝好之後一定要：

1. **開新對話**（中途裝的外掛，舊對話看不到）。
2. 跟 Claude 說「**把我現在有的工具更新到 CLAUDE.md**」，它才記得手上有這些武器。

打 `/mcp` 可以看目前裝了哪些。

**Firecrawl** ✓開源 — 很多網頁（尤其 Facebook、Threads）靠 JavaScript 載入，AI 直接讀只拿到空殼。Firecrawl 把網頁整理成乾淨文字。要到 [firecrawl.dev](https://www.firecrawl.dev/) 註冊拿 API Key，免費方案每月有幾百次額度。用法：「讀這篇文章給我三點摘要」「比較這三個產品頁的規格」。

> 💬 幫我安裝 Firecrawl 和 Playwright 這兩個 MCP，以後爬社群媒體和一般網站用。並告訴我怎麼拿 API Key 給你。

**Playwright** ✓開源（微軟）— 讓 AI 自己開瀏覽器點按鈕、登入、填表、截圖，也能測試你做的網頁工具。建議用**隔離模式**，AI 開的是乾淨瀏覽器，碰不到你平常登入的帳號。送出表單前要它先問你。

**Filesystem** ✓開源 — 讓 AI 讀寫專案以外、你指定的資料夾。只開需要的那一個，不要開放整台電腦。

**Google Workspace** ✓開源（第三方，非 Google 官方）— 讀 Gmail、行事曆、雲端硬碟、文件、試算表，是做「每日早報」的關鍵。要在 Google Cloud 建自己的憑證，預留 15–30 分鐘讓 Claude 一步步帶你。先用**唯讀**，穩定後再一項項開放。憑證不要貼到對話或分享給別人。

> 💬 我想讓你讀我的 Gmail 和 Google 行事曆，請照這份文件用最安全的唯讀方式幫我設定，一步一步帶我：https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/03-google-workspace.md

**Notion** — 讓 AI 讀你的 Notion 筆記和待辦。裝好後打 `/mcp` → notion → Authenticate，在網頁勾選允許讀的頁面。

> 💬 我想讓你讀我的 Notion，請用 Notion 官方的 MCP 幫我設定。

**其他工具**（WordPress、Figma、Canva⋯⋯）：

> 💬 我常用（工具名稱），你能教我怎麼取得 API，讓你可以讀取和編輯嗎？

🔑 **保管鑰匙**：API Key／Token 存在叫 `.env` 的檔案。AI 和工程師看到 `.env` 就知道不能上傳、不能公開。

## Skill 技能：教 AI 你的做事方法

**CLAUDE.md＝記住「你是誰」；Skill＝記住「怎麼做事」。** Skill 就像寫給新同事的 SOP 小卡。

⚠️ **別人的 Skill 不要直接裝。** Skill 本質是指令，裝了 AI 就會照做。不要說「幫我安裝這個 Skill」，要說「**幫我看一下這個 Skill 是什麼？安全嗎？適合我嗎？**」優先選官方或 GitHub 星星數很高的。

**Skill Creator**（Anthropic 官方）✓開源 — 「做技能的技能」，第一個該裝的。你描述想要的流程，它幫你寫出品質好的 Skill。[GitHub](https://github.com/anthropics/skills)

**Brainstorming**（Superpowers 系列）✓開源 — 假設你什麼都不懂，**每次只問一個選擇題**，慢慢帶你把模糊的想法變成具體方案。非工程師想做小工具時特別好用。[GitHub](https://github.com/obra/superpowers)

**UI UX Pro Max** ✓開源 — 整合許多好看的網頁設計範本。適合沒有自己品牌規範的個人；已有品牌色和字體的公司，就給 AI 自己的規範。[GitHub](https://github.com/nextlevelbuilder/ui-ux-pro-max-skill)

**好玩的技能**（distilly、ex-skill、yourself-skill）— 看起來像玩笑，但可以請 Claude 拆解，學別人怎麼設計 AI 的個性和記憶。一樣先請 Claude 看過。

## 讓使用更舒服

**Statusline 狀態列** — 終端機最下面一排：模型、**記憶用量進度條**、額度、時間。AI 記憶超過約 80% 會開始變笨，看到快滿就打 `/compact`。做法：截一張喜歡的狀態列圖貼給 Claude：

> 💬 我想要像這張圖一樣的 Statusline，有進度條、額度剩餘和重置時間，顏色從綠色到紅色，前面放（喜歡的表情符號）。請直接幫我做。

**Obsidian** — 讀寫 `.md` 檔的筆記 App（個人免費，非開源）。Claude 寫的筆記用它打開，表格會變成真的表格。安裝後選「**開啟資料夾作為倉庫**」→ 選你的 Claude 專案資料夾（不要按成「建立新倉庫」）。[obsidian.md](https://obsidian.md)

**部署：Cloudflare／Zeabur** — Claude 做的網頁工具是你電腦上的檔案（`file:///` 開頭），傳給朋友打不開。「部署」後才有公開網址。Cloudflare Pages 適合單純網頁；Zeabur 適合要存資料的工具；GitHub Pages 也是免費的好選擇。放上網路前，先檢查有沒有私人資料。

> 💬 我想把這個工具放上網路讓朋友用。請比較 Cloudflare Pages、Zeabur 和 GitHub Pages，告訴我哪一種適合，再一步一步帶我做。

**背後的小零件**（Homebrew、Node.js、uv、jq，都是開源）：Claude 說「需要安裝 ____」時，回它「好，直接幫我裝」就好。

# 實戰練習

> 前面在「給新同事工具和權限」，現在讓它上工。每一個都只要講需求，不用寫程式。

## 練習 1：讓它上網讀文章（5 分鐘）

> 💬 幫我讀這篇文章，告訴我大綱：（貼網址）

它說「被擋住了」→ **給它第二次機會**：「換個方法試試看」。還是不行 → 裝 Firecrawl。跳出「要信任這個網站嗎」→ 常用網站選「Yes, and don't ask again」。

**學到的：** AI 失敗時不要放棄；真的不行就幫它找工具。

## 練習 2：每日早報 /morning（30 分鐘）

每天早上打 `/morning`，它自動整理「昨天做了什麼」和「今天最重要的事」。先裝好 Google Workspace（和 Notion）。

> 💬 我希望你可以讀我的 Gmail、Google 行事曆和 Notion。幫我做一個 /morning 指令，每次我用的時候，你就彙整昨天的近況和今天的重要任務，做一份早報給我。用最簡單的方式告訴我需要怎麼設定。

它會帶你認證（`/mcp` → 選服務 → 瀏覽器登入），可能給你幾種版本，挑一個說「請幫我建立」。開新對話打 `/morning` 試試。

**做得更好：** 分區（例如「個人／家庭」在上、「工作」在下）；要它「哪個服務沒讀到要老實說」；早報只讀不寫。進階可以每天自動推播到 Email、LINE 或 Discord。

## 練習 3：用 Skill 自動做圖（30 分鐘）

寫完文章或工作匯報，每次都要開 Canva／Figma 一個一個改字？給 AI 一張**範本截圖**，讓它做成 HTML 範本，以後給內容就自動換字、截圖。

> 💬 我想建立一個 Skill：以後我給你一篇文章，你就讀內容，照這張範本圖（貼上截圖）的樣式，做一張 1920×1080 的封面圖。請把範本做成 HTML 檔，方便以後快速修改和截圖。

字體不對 → 告訴它字體名稱。只想改字 → 在 Skill 寫清楚「**只改文字，不動版面**」。也適合週報圖卡、社群貼文、活動海報。

## 練習 4：客製化狀態列（15 分鐘）

> 💬 （貼上狀態列截圖）我想要這樣的 Statusline，有哪些東西可以客製化？前面的表情符號想換成 🐶🥐。請直接幫我製作更新。

說法很重要：不要問「我該怎麼做」（它會教你），要說「**請直接幫我做**」。不像就補充細節，顏色醜就說「想要從綠色漸變到紅色」。**像好老闆一樣把需求講清楚。**

## 練習 5：網頁小工具——報價單產生器（30 分鐘）

用 Canva 改報價單，同事常不小心改壞字型、版面跑掉。截一張現有報價單，開新對話：

> 💬 （貼截圖）幫我製作報價單的網頁工具。左邊是所有要填的欄位，右邊即時預覽；我在左邊填，右邊就跟著變。Logo 和印章等一下給你，先隨便放個底色。

再一次加一個功能：

> 💬 在左側加一個過往報價單清單，先準備三組假資料，點擊就能切換。

> 💬 我們有兩間公司，請在上方加一個切換按鈕，切換 A 公司和 B 公司的資訊。

**好處：** 一個 HTML 檔，傳給同事離線也能用；只能填欄位，沒人能弄亂設計。進階：叫它把 Gmail 裡的報價資訊直接填進欄位。**限制：** 紀錄只存在各自的瀏覽器；要共用就得「部署」上網。

# 安全與常見問題

## 安全守則

AI 很聰明，但它是「拿著你家鑰匙的新同事」。給權限之前先講好規矩：

1. **刪檔一定能救回來**：裝好安全三件套，刪除會進廢紙簍。被擋下時 AI 要回頭問你，不能繞過。
2. **大改之前先存檔**：請它「改之前先備份一份」，有 Git 就先 commit 一次。
3. **鑰匙不外流**：密碼、API Key 不要貼在對話裡、不要放進要公開的檔案；截圖分享時遮起來。
4. **權限從小開始**：外掛先唯讀；寄信、發布、付款、刪除這類收不回來的動作，規定它先問你。
5. **小心來路不明的東西**：只從官網下載；別人的 Skill 和 MCP 先請 Claude 檢查。
6. **公開前檢查隱私**：上網前請它檢查有沒有真實姓名、電話、地址、照片。

**可以直接放進 CLAUDE.md 的安全守則：**

```
## 安全守則
- 刪除檔案前先確認是我要刪的；一律移到廢紙簍，不要永久刪除。
- 大量修改、搬移或刪除檔案前，先備份，並告訴我怎麼回復。
- 被安全規則擋下時，改用可以還原的做法，或用白話問我；不要繞過。
- 寄信、發布、上線、付費、變更權限前，先用一句白話跟我確認。
- 密碼、API Key 不要顯示在對話中，也不要寫進會公開的檔案。
- 日常的讀檔、查資料、寫檔直接做，不必每一步都問。
```

## 常見問題

**打 `claude` 說找不到指令？** 往上捲看安裝訊息的 Setup Notes，照著執行那一行，再重開終端機。

**`Shift + Enter` 直接送出、不能換行？** 你用的是 Mac 內建終端機，改用 cmux。

**設定改了沒反應？** 外掛、快捷鍵、全螢幕模式都要**關掉 Claude 開新對話**才生效。打 `/exit` 離開，再打 `cc`。

**貼長文字變成 `[Pasted text #1 +20 lines]`？** 只是收起來顯示，內容完整。想編輯就用 CotEditor。

**裝了外掛，Claude 說沒有這個工具？** 開新對話；打 `/mcp` 看狀態，需要認證就選它 → Authenticate。

**外掛顯示 `CONNECTION_CLOSED`？** 常見原因是找不到 Node.js。跟 Claude 說：「這個 MCP 顯示 CONNECTION_CLOSED，請檢查是不是要寫完整路徑或補上 PATH。」

**貼授權網址到瀏覽器失敗？** 終端機複製長網址時可能在中間斷行、多出空格，刪掉再試。

**Google 每 7 天要重新登入？** Google Cloud 的「OAuth 同意畫面」還在「測試」狀態。請 Claude 帶你改成「正式版」。看到「Google 尚未驗證這個應用程式」是正常的（自己做給自己用），按「進階 → 前往」。

**Google 登入一直跳成工作帳號？** 用**無痕視窗**打開授權網址。

**Claude 越聊越笨、忘記剛剛的事？** 記憶快滿了，打 `/compact` 或開新對話。

**它叫我自己貼指令？** 回它：「**你直接幫我做**。」

**它下次又忘記？** 說「把這個規則寫進 CLAUDE.md」，再打開確認真的寫進去了。

**一直跳出來問我？** 按 `Shift + Tab` 切換權限模式，並先裝好安全三件套。

**額度用太快？** 在 `/config` 換比較省的模型；一個主題一個對話；Statusline 可以顯示額度和重置時間（每 5 小時、每週各一種）。

**做的網頁傳給朋友打不開？** `file:///` 只有你的電腦打得開。部署上網，或直接傳 HTML 檔給對方用瀏覽器打開。

> 💬 請一步一步帶我，每一步做完等我回報再說下一步。

# 观念入门

**Claude Code（简称 CC）＝住在你电脑里、有手有脚的 AI 助理。** 它不只回答问题，还能真的去读你的文件、上网、操作工具、做出网页小程序。

## AI 的三个阶段

| 阶段 | 比喻 | 能做什么 | 例子 |
|---|---|---|---|
| **Chat 聊天** | 没有手脚的图书馆 | 你问、它答；懂很多，但不能动手 | ChatGPT、Gemini、Claude 网页版 |
| **Cowork 协作** | 外包整理师 | 有一点权限：整理文件夹、读 Gmail、整理 Excel | Claude 桌面版的 Cowork |
| **Code 程序** | 贴身管家（自带工程、设计、内容团队） | 你描述、它创造；记得你、会用你给它的所有工具 | **Claude Code** |

以前用 GPTs、Gems：“这个对话框是写文章助手、那个是旅游助手”，**换一个对话框它就失忆**。Claude Code 把所有工具和技能装在**同一个助理**身上，你只要跟它讲话，它自己判断要用什么。

## 三大优势

1. **深度了解你**：你的偏好、习惯、数据存在你自己的电脑里（一个叫 `CLAUDE.md` 的文件），每次对话它都会先读。
2. **工具箱无限**：把“钥匙”（API Key、MCP 插件）交给它，它就能进你的 Gmail、Notion、WordPress 帮你做事。
3. **用你的方法做事**：把常做的事写成 SOP（叫做 **Skill 技能**），它下次就照你的方法做。

## 名词小字典

| 名词 | 白话解释 |
|---|---|
| **终端机** | 电脑内置、黑底白字、用打字下指令的窗口。装好 cmux 后就像聊天 App。 |
| **CLAUDE.md** | 给 Claude 看的“我的使用说明书”：我是谁、怎么跟我沟通、有哪些规则。 |
| **MCP** | AI 的“外置插座”。接上某个工具的 MCP，AI 就能操作那个工具。 |
| **API Key／Token** | 某个服务发给你的“钥匙”。**像密码一样保管**。 |
| **Skill 技能** | 写给 AI 的“任务 SOP 小卡”。 |
| **/ 指令** | 在对话框打 `/` 开头的快捷指令，例如 `/mcp`、`/config`。 |
| **Vibe Coding** | 不写代码，只用“讲需求”的方式让 AI 做出软件。 |
| **开源** | 代码公开，大家可以检查和改良，通常免费。透明、社群一起维护、不怕公司倒掉。 |
| **部署** | 把电脑上的小工具放上网络，变成别人也能打开的网址。 |
| **上下文** | AI 一次能“记在脑中”的对话量。快满了它会变笨，要用 `/compact` 整理。 |

## 学习时的心态

**1. 愿意“暂时变差”。** 就像从看键盘打字改成盲打，一开始会变慢，习惯后快两三倍。从 ChatGPT 换到终端机，前几天卡卡的是正常的。

**2. 当个“巨婴”。** 遇到不会的，第一反应是问 Claude，不是自己去 Google。它叫你“把这行贴到终端机”时，回它：“**你直接帮我做**”。

**3. 把它当聪明但刚报到的新同事。** 第一次做错不要放弃，给它第二次机会、换个方法。需求要讲清楚，**像好老板一样，不要让人家猜**。前期给它工具、权限、规则是一次性的投资。

**4. 不要想一次到位。** 正确的节奏：描述功能 → Claude 做好 → 你自己试 → 有问题就截屏贴给它 → 它修正 → 再描述下一个功能。

## 要花多少钱？

- Claude Code **需要付费方案**（免费账号只能用网页版聊天）。建议从 **Pro（每月约 20 美元）** 开始，不够再升级 Max。
- 登录时选“用订阅账号”，**不要选“用多少付多少（API 计费）”**，那个可能烧很多钱。
- 大部分插件免费或有免费额度。价格以 claude.com 为准。

> 以 **Mac** 示范，Windows 的差异标 🪟。装好 Claude 之后，后面的步骤几乎都可以贴一句话叫它帮你做。

| 1 | 到正牌官网注册、付费 | 避开钓鱼网站 |
| 2 | 安装 Claude Code | 主角 |
| 3 | 安装 cmux 终端机 | 终端机变得像聊天 App |
| 4 | 创建项目文件夹 | 让 AI 有自己的工作桌 |
| 5 | 创建 CLAUDE.md | 每次对话都懂你 |
| 6 | cc 快捷键＋全屏幕模式 | 打两个字开工、画面不闪 |
| 7 | 安全三件套＋权限模式 | 防误删、少跳窗口 |
| 8 | 长文编辑器 CotEditor | 长段文本不再挤成一行 |

## 第 1 步：注册账号（小心钓鱼网站）

⚠️ Google 搜索“Claude Code”时，**标“赞助商”的结果千万不要点**。有仿冒网站做得一模一样，下载的是恶意程序。只认：`claude.ai`、`claude.com`、`code.claude.com`、`anthropic.com`。

到 [claude.ai](https://claude.ai) 注册，升级到 **Pro 方案**。

## 第 2 步：安装 Claude Code

1. 打开 [官方说明页](https://code.claude.com/docs/zh-CN/overview)，找到“Native Install”。
2. 打开终端机：按 `⌘ + 空白键` → 打“终端机”→ Enter。
3. 粘贴官网的安装指令（目前是 `curl -fsSL https://claude.ai/install.sh | bash`，以官网为准）→ Enter。
4. 装完输入 `claude` → Enter。

**卡关：** 出现“command not found”→ 往上卷，安装消息里有一段 **Setup Notes** 叫你再运行一行指令，照着做就好。

**第一次启动：** 选画面风格 → 登录方式选**第一个（订阅账号）** → 浏览器确认账号、按授权 → 信任文件夹。看到输入框就成功了，打“你好，你能做什么？”试试看。

🪟 Windows：官网有 PowerShell 的安装指令。也可以用 **Claude 桌面版 App** 的 Code 分页，鼠标操作更直觉（第 3、6 步可跳过）。

## 第 3 步：安装 cmux（让终端机变好用）

Mac 内置终端机很难用：按 `Shift+Enter` 想换行却直接送出，鼠标点不到想改的字。[cmux](https://cmux.com/zh-CN)（开源、免费）解决这些问题：

- `Shift + Enter` 换行
- `⌘ + T` 开新分页，**同时让好几个 Claude 做不同的事**
- 拖曳分页可以分割窗口、左右并排

安装：下载 Mac 版 → 拖进“应用程序”→ 打开 cmux → 输入 `claude`。

🪟 Windows：cmux 不支持，可用内置的 Windows Terminal、[WMUX](https://github.com/amirlehmam/wmux)（Windows 版 cmux）或 [Tabby](https://tabby.sh/)（开源）。

## 第 4 步：创建项目文件夹

**不要在电脑最外层开 Claude Code**，给它一张自己的工作桌：在“下载”或“文档”里新建文件夹（例如 `我的 AI Agent`），选取后按 `⌘ + Option + C` 复制路径。

> 💬 我想把工作文件夹设在（粘贴路径），请帮我移动过去，之后的工作都在这里进行。

小技巧：直接把**文件夹或图片拖进终端机**，就会粘贴路径。

## 第 5 步：创建 CLAUDE.md，让它记住你

`CLAUDE.md` 放在项目文件夹里，**每次开新对话 Claude 都会先读**。

**方法 A：从旧 AI 搬家。** 先把这段贴给你以前常用的 AI（ChatGPT 或 Gemini）：

> 💬 请把你所知道关于我的一切整理成一份文档：我的身分、工作、家庭、兴趣、沟通偏好、常做的事、重要的规则和习惯。用条列方式，让我可以交给另一个 AI 助理。

再把它的回答贴给 Claude：

> 💬 这是我在其他 AI 累积的个人数据，请帮我创建 CLAUDE.md 记住我的偏好：（粘贴）

**方法 B：让它访问你。**

> 💬 帮我创建一个 CLAUDE.md 记住我的偏好。请一题一题问我需要的信息。

**范本（可以照抄再改）：**

```
# 我的工作偏好
- 我是（名字），住在（城市），职业是（⋯⋯）。
- 一律用简体中文回答，白话、亲切，少用专业术语；真的要用就解释一句。
- 先讲结论，再讲原因。
- 我不是工程师，请用比喻和白话引导我。
- 运行重要动作前，先给我简短的计划，等我确认再做。
- 不确定或有更好的方法时，上网查过后直接建议。
- 时间一律用（例如 Asia/Shanghai）；处理日期前先确认今天是几号。
```

**测试：** 按 `⌘ + T` 开新对话，问“我是谁？我平常做什么？”。以后它学到新东西，记得说“**把这个写进 CLAUDE.md**”，它偶尔会忘记写。

## 第 6 步：cc 快捷键＋全屏幕模式

以后只要打 `cc` 就进到项目文件夹并打开 Claude；“全屏幕模式”让画面不闪、鼠标可以点、选取文本就自动复制、滚轮能往回看。

> 💬 请照这份文档帮我设置终端机：https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/01-terminal-setup.md ，我的项目文件夹是（贴路径）。你直接帮我做。

| 按键 | 功能 |
|---|---|
| 鼠标拖选 | 自动复制 |
| `Ctrl+O` 再按 `/` | 在对话里搜索 |
| `Ctrl+O` 再按 `[` | 把整段对话倒出来，可用 `⌘+F` 搜索 |

## 第 7 步：安全三件套＋权限模式

Claude 每个动作都问“可以吗？”很烦，但全部放行又怕误删。**先装安全网，再放宽权限：**

1. 🗑️ **删档先进废纸篓**：误删都能救回来。
2. 🚫 **危险指令黑名单**：挡掉“一运行就回不来”的指令。
3. 🧠 **工作守则**：被挡下时要回头问你，不能绕过。

> 💬 我是 AI 与程序的新手。请判断我的电脑系统，帮我安装这份“AI 安全三件套”：https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/02-safety-kit.md 照文档的 AI 运行指引直接帮我装好，用白话跟我说，每次改设置档前先备份。

| 模式 | 白话 | 适合谁 |
|---|---|---|
| **Default** | 每个动作都先问 | 刚入门、想看清楚它在做什么 |
| **Plan** | 只想不动手，你同意才做 | 大工程前先看全貌 |
| **Accept Edits** | 改文件不问，跑指令会问 | 写程序为主 |
| **Auto** | 它自己判断，危险的才问 | **大多数新手首选** |
| **Bypass** | 什么都不问 | 很清楚自己在做什么的人 |

按 `Shift + Tab` 切换模式；打 `/config` 看所有设置（包含模型）。Pro 方案想省额度可以选比较省的模型，要最聪明就选最强的，不确定选 Default。

## 第 8 步：长文编辑器 CotEditor

一次贴很长的文本，输入框会缩成 `[Pasted text +20 lines]`，看不到也改不了。

> 💬 每次我要贴一大段文本给你，终端机都会缩成一行，没办法编辑。我想用 CotEditor 当外部编辑器，请帮我安装并设置好。

用法：按 `Ctrl + G` → CotEditor 跳出来 → 写好 `⌘ + S` 存盘、`⌘ + W` 关窗口 → 文本回到对话框 → Enter。

⚠️ 踩过的坑：按 `Ctrl+G` 跳出 Chrome 的 Gemini，是 Chrome 抢走了快捷键。请 Claude 把外部编辑器改到别的键（例如 `Ctrl+E`）。设置完要**关掉 Claude 重开新对话**才生效。

## ✅ 第一天检查表

- 打 `cc` 能直接进到项目文件夹并打开 Claude
- `Shift + Enter` 可以换行
- 开新对话问“我是谁”，它答得出来
- 删档会进废纸篓
- 不会每个动作都跳出来问你
- 快捷键能打开长文编辑器

| **Statusline** | Claude 设置 | 内置 | 免费 | ★★ 推荐 | 随时看 AI 记忆快不快满 |
| **Obsidian** | 笔记 App | ✗ | 个人免费 | ★ 选用 | 漂亮地读 AI 写的 .md 档 |
| **Cloudflare／Zeabur** | 部署服务 | ✗ | 有免费方案 | ★ 要分享时 | 把小工具放上网络 |

**为什么开源很重要？** 代码公开，全世界都能检查有没有做坏事；通常免费；原作者不维护时社群也能接手。

**万用安装公式：** 不要自己照着指令打，把说明网址丢给 Claude。GitHub 页面的 **Raw** 按钮会变成纯文本，AI 读得更快。

> 💬 帮我看一下这个（贴网址）是什么？适合我吗？如果适合，请直接帮我安装。

## 基础环境

**Claude Code** — Anthropic 做的 AI 助理，能读写文件、运行指令、上网、接插件。数据在你自己电脑上，越用越懂你。用得更好：一个主题开一个对话；记忆快满打 `/compact`；常用 `/mcp`、`/config`、`Shift+Tab`（切换权限）、`Esc`（打断它）。

**cmux** ✓开源 — 以 Ghostty 为内核、为 AI 设计的终端机。用得更好：一个分页做早报、一个做网页、一个查资料，同时进行；把分页拖到一侧就能左右并排。

**cc＋全屏幕模式** — `cc`＝进项目文件夹＋打开 Claude。注意：全屏幕模式下 `⌘+F` 失效，改用 `Ctrl+O` 再按 `/`。

**CotEditor** ✓开源 — Mac 上轻巧的纯文本编辑器。在 Claude 里叫出来写长文，表情符号和换行都会保留。

## MCP 插件：让 AI 长出手脚

**MCP＝AI 的外置插座。** 安全原则：第一次先开最小权限，**能只读就先只读**。装好之后一定要：

1. **开新对话**（中途装的插件，旧对话看不到）。
2. 跟 Claude 说“**把我现在有的工具更新到 CLAUDE.md**”，它才记得手上有这些武器。

打 `/mcp` 可以看目前装了哪些。

**Firecrawl** ✓开源 — 很多网页（尤其 Facebook、Threads）靠 JavaScript 加载，AI 直接读只拿到空壳。Firecrawl 把网页整理成干净文本。要到 [firecrawl.dev](https://www.firecrawl.dev/) 注册拿 API Key，免费方案每月有几百次额度。用法：“读这篇文章给我三点摘要”“比较这三个产品页的规格”。

> 💬 帮我安装 Firecrawl 和 Playwright 这两个 MCP，以后爬社群媒体和一般网站用。并告诉我怎么拿 API Key 给你。

**Playwright** ✓开源（微软）— 让 AI 自己开浏览器点按钮、登录、填表、截屏，也能测试你做的网页工具。建议用**隔离模式**，AI 开的是干净浏览器，碰不到你平常登录的账号。送出表单前要它先问你。

**Filesystem** ✓开源 — 让 AI 读写项目以外、你指定的文件夹。只开需要的那一个，不要开放整台电脑。

**Google Workspace** ✓开源（第三方，非 Google 官方）— 读 Gmail、日历、云端硬盘、文档、试算表，是做“每日早报”的关键。要在 Google Cloud 建自己的凭证，预留 15–30 分钟让 Claude 一步步带你。先用**唯读**，稳定后再一项项开放。凭证不要贴到对话或分享给别人。

> 💬 我想让你读我的 Gmail 和 Google 日历，请照这份文档用最安全的唯读方式帮我设置，一步一步带我：https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/03-google-workspace.md

**Notion** — 让 AI 读你的 Notion 笔记和待办。装好后打 `/mcp` → notion → Authenticate，在网页勾选允许读的页面。

> 💬 我想让你读我的 Notion，请用 Notion 官方的 MCP 帮我设置。

**其他工具**（WordPress、Figma、Canva⋯⋯）：

> 💬 我常用（工具名称），你能教我怎么取得 API，让你可以读取和编辑吗？

🔑 **保管钥匙**：API Key／Token 存在叫 `.env` 的文件。AI 和工程师看到 `.env` 就知道不能上传、不能公开。

## Skill 技能：教 AI 你的做事方法

**CLAUDE.md＝记住“你是谁”；Skill＝记住“怎么做事”。** Skill 就像写给新同事的 SOP 小卡。

⚠️ **别人的 Skill 不要直接装。** Skill 本质是指令，装了 AI 就会照做。不要说“帮我安装这个 Skill”，要说“**帮我看一下这个 Skill 是什么？安全吗？适合我吗？**”优先选官方或 GitHub 星星数很高的。

**Skill Creator**（Anthropic 官方）✓开源 — “做技能的技能”，第一个该装的。你描述想要的流程，它帮你写出品质好的 Skill。[GitHub](https://github.com/anthropics/skills)

**Brainstorming**（Superpowers 系列）✓开源 — 假设你什么都不懂，**每次只问一个选择题**，慢慢带你把模糊的想法变成具体方案。非工程师想做小工具时特别好用。[GitHub](https://github.com/obra/superpowers)

**UI UX Pro Max** ✓开源 — 集成许多好看的网页设计范本。适合没有自己品牌规范的个人；已有品牌色和字体的公司，就给 AI 自己的规范。[GitHub](https://github.com/nextlevelbuilder/ui-ux-pro-max-skill)

**好玩的技能**（distilly、ex-skill、yourself-skill）— 看起来像玩笑，但可以请 Claude 拆解，学别人怎么设计 AI 的个性和记忆。一样先请 Claude 看过。

## 让使用更舒服

**Statusline 状态栏** — 终端机最下面一排：模型、**记忆用量进度条**、额度、时间。AI 记忆超过约 80% 会开始变笨，看到快满就打 `/compact`。做法：截一张喜欢的状态栏图贴给 Claude：

> 💬 我想要像这张图一样的 Statusline，有进度条、额度剩余和重置时间，颜色从绿色到红色，前面放（喜欢的表情符号）。请直接帮我做。

**Obsidian** — 读写 `.md` 档的笔记 App（个人免费，非开源）。Claude 写的笔记用它打开，表格会变成真的表格。安装后选“**打开文件夹作为仓库**”→ 选你的 Claude 项目文件夹（不要按成“创建新仓库”）。[obsidian.md](https://obsidian.md)

**部署：Cloudflare／Zeabur** — Claude 做的网页工具是你电脑上的文件（`file:///` 开头），传给朋友打不开。“部署”后才有公开网址。Cloudflare Pages 适合单纯网页；Zeabur 适合要存数据的工具；GitHub Pages 也是免费的好选择。放上网络前，先检查有没有私人数据。

> 💬 我想把这个工具放上网络让朋友用。请比较 Cloudflare Pages、Zeabur 和 GitHub Pages，告诉我哪一种适合，再一步一步带我做。

**背后的小零件**（Homebrew、Node.js、uv、jq，都是开源）：Claude 说“需要安装 ____”时，回它“好，直接帮我装”就好。

# 实战练习

> 前面在“给新同事工具和权限”，现在让它上工。每一个都只要讲需求，不用写程序。

## 练习 1：让它上网读文章（5 分钟）

> 💬 帮我读这篇文章，告诉我大纲：（贴网址）

它说“被挡住了”→ **给它第二次机会**：“换个方法试试看”。还是不行 → 装 Firecrawl。跳出“要信任这个网站吗”→ 常用网站选“Yes, and don't ask again”。

**学到的：** AI 失败时不要放弃；真的不行就帮它找工具。

## 练习 2：每日早报 /morning（30 分钟）

每天早上打 `/morning`，它自动整理“昨天做了什么”和“今天最重要的事”。先装好 Google Workspace（和 Notion）。

> 💬 我希望你可以读我的 Gmail、Google 日历和 Notion。帮我做一个 /morning 指令，每次我用的时候，你就汇整昨天的近况和今天的重要任务，做一份早报给我。用最简单的方式告诉我需要怎么设置。

它会带你认证（`/mcp` → 选服务 → 浏览器登录），可能给你几种版本，挑一个说“请帮我创建”。开新对话打 `/morning` 试试。

**做得更好：** 分区（例如“个人／家庭”在上、“工作”在下）；要它“哪个服务没读到要老实说”；早报只读不写。高端可以每天自动推播到 Email、LINE 或 Discord。

## 练习 3：用 Skill 自动做图（30 分钟）

写完文章或工作汇报，每次都要开 Canva／Figma 一个一个改字？给 AI 一张**范本截屏**，让它做成 HTML 范本，以后给内容就自动换字、截屏。

> 💬 我想创建一个 Skill：以后我给你一篇文章，你就读内容，照这张范本图（粘贴截屏）的样式，做一张 1920×1080 的封面图。请把范本做成 HTML 档，方便以后快速修改和截屏。

字体不对 → 告诉它字体名称。只想改字 → 在 Skill 写清楚“**只改文本，不动版面**”。也适合周报图卡、社群贴文、活动海报。

## 练习 4：客制化状态栏（15 分钟）

> 💬 （粘贴状态栏截屏）我想要这样的 Statusline，有哪些东西可以客制化？前面的表情符号想换成 🐶🥐。请直接帮我制作更新。

说法很重要：不要问“我该怎么做”（它会教你），要说“**请直接帮我做**”。不像就补充细节，颜色丑就说“想要从绿色渐变到红色”。**像好老板一样把需求讲清楚。**

## 练习 5：网页小工具——报价单产生器（30 分钟）

用 Canva 改报价单，同事常不小心改坏字体、版面跑掉。截一张现有报价单，开新对话：

> 💬 （贴截屏）帮我制作报价单的网页工具。左边是所有要填的字段，右边即时预览；我在左边填，右边就跟着变。Logo 和印章等一下给你，先随便放个底色。

再一次加一个功能：

> 💬 在左侧加一个过往报价单清单，先准备三组假数据，点击就能切换。

> 💬 我们有两间公司，请在上方加一个切换按钮，切换 A 公司和 B 公司的信息。

**好处：** 一个 HTML 档，传给同事脱机也能用；只能填字段，没人能弄乱设计。高端：叫它把 Gmail 里的报价信息直接填进字段。**限制：** 纪录只存在各自的浏览器；要共用就得“部署”上网。

## 还能做什么

| 类型 | 例子 |
|---|---|
| 生活 | 家庭记帐、旅行共同记帐、食谱 App、购物清单 |
| 学习 | 语言单字卡、视频加字幕、读书笔记整理 |
| 工作 | 团队仪表板、会议记录、报价单、周报 |

**找点子：** 想想“哪件事我每周都在重复做、而且很烦？”那就是第一个该交给 AI 的。不用急，一步一步来。

# 安全与常见问题

## 安全守则

AI 很聪明，但它是“拿着你家钥匙的新同事”。给权限之前先讲好规矩：

1. **删档一定能救回来**：装好安全三件套，删除会进废纸篓。被挡下时 AI 要回头问你，不能绕过。
2. **大改之前先存盘**：请它“改之前先备份一份”，有 Git 就先 commit 一次。
3. **钥匙不外流**：密码、API Key 不要贴在对话里、不要放进要公开的文件；截屏分享时遮起来。
4. **权限从小开始**：插件先唯读；寄信、发布、付款、删除这类收不回来的动作，规定它先问你。
5. **小心来路不明的东西**：只从官网下载；别人的 Skill 和 MCP 先请 Claude 检查。
6. **公开前检查隐私**：上网前请它检查有没有真实姓名、电话、地址、照片。

**可以直接放进 CLAUDE.md 的安全守则：**

```
## 安全守则
- 删除文件前先确认是我要删的；一律移到废纸篓，不要永久删除。
- 大量修改、搬移或删除文件前，先备份，并告诉我怎么回复。
- 被安全规则挡下时，改用可以还原的做法，或用白话问我；不要绕过。
- 寄信、发布、上线、付费、变更权限前，先用一句白话跟我确认。
- 密码、API Key 不要显示在对话中，也不要写进会公开的文件。
- 日常的读档、查资料、写档直接做，不必每一步都问。
```

## 常见问题

**打 `claude` 说找不到指令？** 往上卷看安装消息的 Setup Notes，照着运行那一行，再重开终端机。

**`Shift + Enter` 直接送出、不能换行？** 你用的是 Mac 内置终端机，改用 cmux。

**设置改了没反应？** 插件、快捷键、全屏幕模式都要**关掉 Claude 开新对话**才生效。打 `/exit` 离开，再打 `cc`。

**贴长文本变成 `[Pasted text #1 +20 lines]`？** 只是收起来显示，内容完整。想编辑就用 CotEditor。

**装了插件，Claude 说没有这个工具？** 开新对话；打 `/mcp` 看状态，需要认证就选它 → Authenticate。

**插件显示 `CONNECTION_CLOSED`？** 常见原因是找不到 Node.js。跟 Claude 说：“这个 MCP 显示 CONNECTION_CLOSED，请检查是不是要写完整路径或补上 PATH。”

**贴授权网址到浏览器失败？** 终端机复制长网址时可能在中间断行、多出空格，删掉再试。

**Google 每 7 天要重新登录？** Google Cloud 的“OAuth 同意画面”还在“测试”状态。请 Claude 带你改成“正式版”。看到“Google 尚未验证这个应用程序”是正常的（自己做给自己用），按“高端 → 前往”。

**Google 登录一直跳成工作账号？** 用**无痕窗口**打开授权网址。

**Claude 越聊越笨、忘记刚刚的事？** 记忆快满了，打 `/compact` 或开新对话。

**它叫我自己贴指令？** 回它：“**你直接帮我做**。”

**它下次又忘记？** 说“把这个规则写进 CLAUDE.md”，再打开确认真的写进去了。

**一直跳出来问我？** 按 `Shift + Tab` 切换权限模式，并先装好安全三件套。

**额度用太快？** 在 `/config` 换比较省的模型；一个主题一个对话；Statusline 可以显示额度和重置时间（每 5 小时、每周各一种）。

**做的网页传给朋友打不开？** `file:///` 只有你的电脑打得开。部署上网，或直接传 HTML 档给对方用浏览器打开。

## 卡住时的万用求救句

> 💬 我是新手，现在卡在这里（贴截屏）。请用白话告诉我发生什么事，能直接帮我修的就直接修。

> 💬 这个设置现在还是这样做吗？请上网查最新的官方说法。

> 💬 请一步一步带我，每一步做完等我回报再说下一步。

# Before you start

**Claude Code is more than a coding tool. It is an AI assistant that actually does things for you**: it reads your files, searches the web, checks your Gmail and calendar, and builds small web tools.

- **The hardest part is the first setup.** You do it once and it keeps working. This guide walks you through that setup in one go.
- **You don't need to know how to code.** When you get stuck, hand the problem (or even this page) to Claude and say "just do it for me".
- Boxes marked 💬 are **messages you can copy and paste straight into Claude**. Use the "Copy" button in the corner.

## Suggested learning path

| Day | What to do |
|---|---|
| Day 1 | Read "Key ideas", then follow "Setup" to install Claude Code, cmux, CLAUDE.md and the safety kit |
| Day 2 | Follow "Tools" to install Firecrawl and Playwright so the AI can browse the web |
| Day 3 | Build a daily morning briefing in "Practice" (Gmail, Calendar, Notion) |
| Day 4–5 | Build your own small tool (quote generator, budget sheet, recipe cards…) |
| After that | Spend 15 minutes a day "teaching" it one thing. After a week it feels like a personal assistant |

## Three things to remember

- 🍼 **Be a "big baby"**: if you don't know something, ask Claude and tell it "just do it for me". Don't spend an hour searching Google.
- 🧑‍🏫 **Treat it like a new colleague**: it's normal if the first try isn't right. Give it a second chance and explain more clearly.
- 🛡️ **Install safety first**: set up delete protection before you let it loose.

AI tools change fast (this page was written in October 2026). Prices and commands on the official sites take priority.

# Key ideas

**Claude Code (CC for short) = an AI assistant that lives on your computer and has hands.** It doesn't only answer questions. It reads your files, browses the web, operates tools and builds small web apps.

## Three stages of AI

| Stage | Analogy | What it can do | Examples |
|---|---|---|---|
| **Chat** | A library with no hands | You ask, it answers. It knows a lot but can't act | ChatGPT, Gemini, Claude on the web |
| **Cowork** | A hired organizer | Some permissions: tidy folders, read Gmail, clean up spreadsheets | Cowork in the Claude desktop app |
| **Code** | A personal butler with its own engineering, design and writing team | You describe, it builds. It remembers you and uses every tool you give it | **Claude Code** |

With custom GPTs or Gems, one chat is your "writing assistant" and another is your "travel assistant", and **switching chats means it forgets everything**. Claude Code puts every tool and skill on **one assistant**. You just talk to it and it decides what to use.

## Three strengths

1. **It knows you well**: your preferences, habits and data live on your own computer (in a file called `CLAUDE.md`), and it reads that at the start of every conversation.
2. **Unlimited toolbox**: give it the "keys" (API keys, MCP plugins) and it can work inside your Gmail, Notion or WordPress for you.
3. **It works your way**: write your recurring tasks down as SOPs (called **Skills**) and it follows your method next time.

## Mini glossary

| Term | Plain meaning |
|---|---|
| **Terminal** | The built-in window where you type commands on a black background. With cmux it feels like a chat app. |
| **CLAUDE.md** | Your "user manual" for Claude: who you are, how to talk to you, your rules. |
| **MCP** | A "power socket" for AI. Plug in a tool's MCP and the AI can operate that tool. |
| **API key / token** | A "key" a service gives you. **Guard it like a password.** |
| **Skill** | An SOP card for the AI. |
| **/ command** | Shortcuts you type starting with `/`, such as `/mcp` or `/config`. |
| **Vibe coding** | Building software by describing what you want, without writing code. |
| **Open source** | The code is public, anyone can check and improve it, usually free. Transparent, community-maintained, and it survives even if a company disappears. |
| **Deploy** | Putting a tool from your computer onto the internet so others can open it with a link. |
| **Context** | How much conversation the AI can hold in its head at once. When it's nearly full the AI gets worse; tidy it with `/compact`. |

## The right mindset

**1. Accept getting worse for a while.** Like switching from looking at the keyboard to touch typing: you're slower at first, then two or three times faster. Moving from ChatGPT to a terminal feels clumsy for a few days. That's normal.

**2. Be a "big baby".** When you don't know something, your first move is to ask Claude, not Google. If it says "paste this line into your terminal", reply: "**Please just do it for me.**"

**3. Treat it like a smart new hire.** If it gets something wrong, don't give up: let it try again another way. Be clear about what you want, **like a good boss who doesn't make people guess**. Time spent giving it tools, permissions and rules is a one-time investment.

**4. Don't expect perfection on the first try.** The right rhythm: describe a feature → Claude builds it → you test it → if something's wrong, paste a screenshot → it fixes it → describe the next feature.

## What does it cost?

- Claude Code **needs a paid plan** (free accounts can only use the web chat). Start with **Pro (about USD 20/month)** and upgrade to Max if you run out.
- When logging in, choose "Claude subscription account". **Don't pick pay-as-you-go API billing**; it can get expensive fast.
- Most plugins are free or have a free tier. Check claude.com for current prices.

# Setup

> Shown on a **Mac**; Windows differences are marked 🪟. Once Claude is installed, you can paste one sentence and let it do almost every later step for you.

| # | What | Why |
|---|---|---|
| 1 | Sign up and pay on the real website | Avoid phishing sites |
| 2 | Install Claude Code | The main tool |
| 3 | Install the cmux terminal | Makes the terminal feel like a chat app |
| 4 | Create a project folder | Gives the AI its own desk |
| 5 | Create CLAUDE.md | It knows you in every conversation |
| 6 | `cc` shortcut + fullscreen mode | Start with two letters, no flickering |
| 7 | Safety kit + permission mode | Undo-able deletes, fewer pop-ups |
| 8 | CotEditor for long text | Long messages stop collapsing into one line |

## Step 1: Sign up (watch out for phishing)

⚠️ When you search Google for "Claude Code", **never click results marked "Sponsored"**. Some fake sites look identical and serve malware. Trust only `claude.ai`, `claude.com`, `code.claude.com` and `anthropic.com`.

Sign up at [claude.ai](https://claude.ai) and upgrade to the **Pro plan**.

## Step 2: Install Claude Code

1. Open the [official docs](https://code.claude.com/docs/en/overview) and find "Native Install".
2. Open Terminal: press `⌘ + Space`, type "Terminal", press Enter.
3. Paste the install command from the site (currently `curl -fsSL https://claude.ai/install.sh | bash`; the site takes priority) and press Enter.
4. When it's done, type `claude` and press Enter.

**If you get "command not found"**: scroll up. The install output has a **Setup Notes** section telling you to run one more line. Run it.

**First launch:** pick a theme → choose the **first login option (subscription account)** → confirm your account in the browser and authorize → trust the folder. When you see the input box, you're in. Try "Hi, what can you do?"

🪟 Windows: the docs have a PowerShell install command. You can also use the Code tab in the **Claude desktop app**, which is mouse-friendly (then you can skip steps 3 and 6).

## Step 3: Install cmux (a better terminal)

The built-in Mac Terminal is awkward: `Shift+Enter` sends the message instead of adding a new line, and you can't click to move the cursor. [cmux](https://cmux.com) (open source, free) fixes this:

- `Shift + Enter` adds a new line
- `⌘ + T` opens a new tab, so **several Claudes can work on different jobs at once**
- Drag tabs to split the window side by side

Install: download the Mac version → drag it to Applications → open cmux → type `claude`.

🪟 Windows: cmux isn't available. Use the built-in Windows Terminal, [WMUX](https://github.com/amirlehmam/wmux) (a cmux-style app for Windows) or [Tabby](https://tabby.sh/) (open source).

## Step 4: Create a project folder

**Don't start Claude Code in the top level of your computer.** Give it its own desk: create a folder in Downloads or Documents (for example `My AI Agent`), select it and press `⌘ + Option + C` to copy its path.

> 💬 I want my working folder to be (paste path). Please move there, and let's do all future work in this folder.

Tip: you can **drag a folder or image into the terminal** to paste its path.

## Step 5: Create CLAUDE.md so it remembers you

`CLAUDE.md` lives in your project folder, and **Claude reads it at the start of every new conversation**.

**Option A: move over from another AI.** First paste this into the AI you used before (ChatGPT or Gemini):

> 💬 Please put everything you know about me into one document: who I am, my work, family, interests, communication preferences, things I do often, and important rules and habits. Use bullet points so I can hand it to another AI assistant.

Then paste its answer into Claude:

> 💬 This is what another AI has learned about me. Please create a CLAUDE.md that remembers my preferences: (paste)

**Option B: let it interview you.**

> 💬 Please create a CLAUDE.md that remembers my preferences. Ask me what you need to know, one question at a time.

**Template (copy and adapt):**

```
# My preferences
- I'm (name), I live in (city), and I work as (…).
- Always answer in English, in plain, friendly language. Avoid jargon; if you must use it, explain it in one line.
- Give the conclusion first, then the reasons.
- I'm not an engineer, so guide me with analogies and simple words.
- Before any important action, show me a short plan and wait for my OK.
- If you're unsure or know a better way, research it online and suggest it directly.
- Always use my time zone (e.g. Europe/London); check today's date before working with dates.
```

**Test:** press `⌘ + T` for a new conversation and ask "Who am I and what do I usually do?". Whenever it learns something new, say "**Write this into CLAUDE.md**". It sometimes forgets.

## Step 6: `cc` shortcut + fullscreen mode

From now on, typing `cc` takes you to your project folder and opens Claude. Fullscreen mode stops the flickering, lets you click with the mouse, copies text as soon as you select it, and lets you scroll back.

> 💬 Please set up my terminal using this document: https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/01-terminal-setup.md My project folder is (paste path). Please do it for me.

| Keys | What it does |
|---|---|
| Drag to select | Copies automatically |
| `Ctrl+O`, then `/` | Search the conversation |
| `Ctrl+O`, then `[` | Dump the whole conversation so you can search with `⌘+F` |

## Step 7: Safety kit + permission mode

It's annoying when Claude asks "May I?" before every action, but letting everything through feels risky. **Install a safety net first, then relax permissions:**

1. 🗑️ **Deleted files go to the Trash**, so you can always get them back.
2. 🚫 **Dangerous-command blocklist**: blocks commands that can't be undone.
3. 🧠 **Working rules**: when blocked, it must come back and ask you, not find a way around.

> 💬 I'm new to AI and programming. Please check my operating system and install this "AI safety kit" for me: https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/02-safety-kit.md Follow the AI instructions in the document, explain in plain English, and back up every settings file before changing it.

| Mode | Plain meaning | Good for |
|---|---|---|
| **Default** | Asks before every action | Beginners who want to see what it's doing |
| **Plan** | Only plans; acts after you approve | Getting the big picture before a big job |
| **Accept Edits** | Edits files without asking, asks before commands | Mostly coding |
| **Auto** | Decides itself and asks only about risky things | **Best choice for most beginners** |
| **Bypass** | Never asks | People who know exactly what they're doing |

Press `Shift + Tab` to switch modes; type `/config` to see all settings (including the model). On Pro, a lighter model saves usage; the strongest model is the smartest. If unsure, choose Default.

## Step 8: CotEditor for long text

When you paste a long text, the input box collapses to `[Pasted text +20 lines]` and you can't see or edit it.

> 💬 Whenever I paste a long text, the terminal collapses it into one line and I can't edit it. I'd like to use CotEditor as an external editor. Please install and set it up.

How to use: press `Ctrl + G` → CotEditor opens → write, then `⌘ + S` to save and `⌘ + W` to close → the text returns to the input box → press Enter.

⚠️ A problem we hit: if `Ctrl+G` opens Chrome's Gemini instead, Chrome has taken over that shortcut. Ask Claude to move the external editor to another key (for example `Ctrl+E`). After any setting change, **quit Claude and start a new conversation**.

## ✅ Day-one checklist

- Typing `cc` opens Claude in your project folder
- `Shift + Enter` adds a new line
- In a new conversation, it can answer "Who am I?"
- Deleted files go to the Trash
- It doesn't ask permission for every little thing
- Your shortcut opens the long-text editor

## Basics

**Claude Code** — Anthropic's AI assistant. It reads and writes files, runs commands, browses the web and connects to plugins. Your data stays on your computer, so it gets to know you better over time. Tips: one topic per conversation; type `/compact` when memory is nearly full; useful keys are `/mcp`, `/config`, `Shift+Tab` (switch permission mode) and `Esc` (interrupt).

**cmux** ✓ open source — a terminal built on Ghostty and designed for AI agents. Tips: one tab for the morning briefing, one for a web tool, one for research, all at once; drag a tab to the side to see two side by side.

**cc + fullscreen** — `cc` = go to the project folder and open Claude. Note: in fullscreen mode `⌘+F` doesn't work; use `Ctrl+O` then `/`.

**CotEditor** ✓ open source — a light plain-text editor for Mac. Open it from Claude to write long messages; emoji and line breaks are kept.

## MCP plugins: giving the AI hands

**MCP = a power socket for AI.** Safety rule: start with the smallest permissions, **read-only whenever possible**. After installing, always:

1. **Start a new conversation** (old conversations can't see plugins added later).
2. Tell Claude "**Update CLAUDE.md with the tools I have now**" so it remembers its toolbox.

Type `/mcp` to see what's installed.

**Firecrawl** ✓ open source — many pages (especially Facebook and Threads) load with JavaScript, so the AI only sees an empty shell. Firecrawl turns pages into clean text. Get an API key at [firecrawl.dev](https://www.firecrawl.dev/); the free plan includes a few hundred pages a month. Use it for "summarize this article in three points" or "compare the specs on these three product pages".

> 💬 Please install the Firecrawl and Playwright MCPs so you can read social media and regular websites. Tell me how to get the API key for you.

**Playwright** ✓ open source (Microsoft) — lets the AI open its own browser to click, log in, fill forms and take screenshots, and test web tools you build. Use **isolated mode** so it runs a clean browser that can't touch your logged-in accounts. Have it ask you before submitting any form.

**Filesystem** ✓ open source — lets the AI read and write one folder outside the project that you choose. Open only the folder you need, never the whole computer.

**Google Workspace** ✓ open source (third-party, not made by Google) — reads Gmail, Calendar, Drive, Docs and Sheets. It's the key to a morning briefing. You create your own credentials in Google Cloud; allow 15–30 minutes and let Claude guide you step by step. Start **read-only** and open more later. Never paste credentials into a chat or share them.

> 💬 I'd like you to read my Gmail and Google Calendar. Please follow this document, use the safest read-only setup, and guide me step by step: https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/03-google-workspace.md

**Notion** — lets the AI read your Notion notes and to-dos. After installing, type `/mcp` → notion → Authenticate and tick the pages it may read.

> 💬 I'd like you to read my Notion. Please set it up with Notion's official MCP.

**Other tools** (WordPress, Figma, Canva…):

> 💬 I use (tool name) a lot. Can you show me how to get an API key so you can read and edit it?

🔑 **Keep your keys safe**: store API keys and tokens in a file called `.env`. AI tools and engineers know `.env` must never be uploaded or made public.

## Skills: teaching the AI your methods

**CLAUDE.md = remember who you are. A Skill = remember how to do something.** A skill is like an SOP card for a new colleague.

⚠️ **Don't install other people's skills blindly.** A skill is a set of instructions the AI will follow. Instead of "install this skill", say "**What is this skill? Is it safe? Is it right for me?**" Prefer official skills or GitHub projects with many stars.

**Skill Creator** (official, Anthropic) ✓ open source — the "skill for making skills", and the first one to install. Describe a workflow and it writes a well-structured skill. [GitHub](https://github.com/anthropics/skills)

**Brainstorming** (Superpowers) ✓ open source — assumes you know nothing and **asks one multiple-choice question at a time**, turning a vague idea into a concrete plan. Great for non-engineers building small tools. [GitHub](https://github.com/obra/superpowers)

**UI UX Pro Max** ✓ open source — bundles many good-looking web design patterns. Good for individuals without brand guidelines; if your company has its own colors and fonts, give the AI those instead. [GitHub](https://github.com/nextlevelbuilder/ui-ux-pro-max-skill)

**Fun skills** (distilly, ex-skill, yourself-skill) — they look like jokes, but you can ask Claude to break them down and learn how others design an AI's personality and memory. Again, have Claude review them first.

## Comfort upgrades

**Statusline** — the bottom line of the terminal: model, **memory usage bar**, usage limits, time. Above roughly 80% memory, the AI starts getting worse; type `/compact` when it's nearly full. Paste a screenshot of a status line you like:

> 💬 I'd like a status line like this picture, with a progress bar, remaining usage and reset time, colored from green to red, with (your favorite emoji) at the start. Please build it for me.

**Obsidian** — a notes app for `.md` files (free for personal use, not open source). Open Claude's notes in it and tables become real tables. After installing, choose "**Open folder as vault**" and pick your Claude project folder (not "Create new vault"). [obsidian.md](https://obsidian.md)

**Deploying: Cloudflare / Zeabur** — a web tool Claude builds is a file on your computer (starting with `file:///`), so friends can't open the link. Deploying gives it a public address. Cloudflare Pages suits simple pages; Zeabur suits tools that store data; GitHub Pages is another good free option. Check for personal data before putting anything online.

> 💬 I want to put this tool online for friends. Please compare Cloudflare Pages, Zeabur and GitHub Pages, tell me which one fits, and walk me through it step by step.

**Behind-the-scenes parts** (Homebrew, Node.js, uv, jq — all open source): when Claude says "we need to install ____", reply "OK, install it for me".

# Practice

> So far you've been giving your new colleague tools and permissions. Now put it to work. Each exercise only needs a description, no code.

## Exercise 1: Read an article from the web (5 min)

> 💬 Please read this article and give me an outline: (paste link)

If it says it was blocked, **give it a second chance**: "Try another way." Still failing? Install Firecrawl. If it asks whether to trust a site, choose "Yes, and don't ask again" for sites you use often.

**Lesson:** don't give up when the AI fails; if it really can't, find it a tool.

## Exercise 2: Morning briefing /morning (30 min)

Type `/morning` each morning and it summarizes what you did yesterday and what matters most today. Install Google Workspace (and Notion) first.

> 💬 I'd like you to read my Gmail, Google Calendar and Notion. Please create a /morning command: whenever I use it, summarize yesterday and today's most important tasks as a morning briefing. Tell me the simplest way to set this up.

It will guide you through login (`/mcp` → pick the service → log in in the browser). It may offer several versions; pick one and say "Please create it". Then open a new conversation and type `/morning`.

**Make it better:** use sections (for example personal/family on top, work below); ask it to "tell me honestly if any service couldn't be read"; keep the briefing read-only. Later you can have it sent automatically by email, LINE or Discord.

## Exercise 3: Auto-generated images with a Skill (30 min)

Tired of opening Canva or Figma to change text by hand for every article or weekly report? Give the AI a **template screenshot**, let it turn it into an HTML template, and from then on just give it content.

> 💬 I want to create a Skill: whenever I give you an article, read it and make a 1920×1080 cover image in the style of this template (paste screenshot). Please build the template as an HTML file so it's quick to edit and screenshot.

Wrong font? Tell it the font name. Only want text changed? Write in the skill "**change only the text, never the layout**". Also good for weekly report cards, social posts and event posters.

## Exercise 4: Customize the status line (15 min)

> 💬 (paste a screenshot of a status line) I'd like a status line like this. What can I customize? I want 🐶🥐 as the emoji at the start. Please build and update it for me.

Wording matters: don't ask "How do I do this?" (it will teach you). Say "**Please do it for me.**" If it's not right, add details; if the colors are dull, say "I want a gradient from green to red". **Be clear like a good boss.**

## Exercise 5: A small web tool — quote generator (30 min)

Editing quotes in Canva, colleagues break fonts and layouts by accident. Take a screenshot of an existing quote and start a new conversation:

> 💬 (paste screenshot) Please build a web tool for quotes. All the fields to fill in on the left, a live preview on the right that updates as I type. I'll give you the logo and stamp later; use a placeholder color for now.

Then add one feature at a time:

> 💬 Add a list of past quotes on the left with three sets of sample data, and switch between them when I click.

> 💬 We have two companies. Add a switch at the top to change between company A and company B details.

**Benefits:** it's one HTML file you can send to colleagues, and it works offline; people can only fill in fields, so nobody breaks the design. Advanced: have it fill the fields directly from quotes in your Gmail. **Limit:** records are saved only in each person's browser; to share them, deploy it online.

# Safety & FAQ

## Safety rules

The AI is smart, but it's a new colleague holding your house keys. Agree on the rules before handing over permissions:

1. **Deletes must be recoverable**: with the safety kit, deleted files go to the Trash. When blocked, the AI must ask you, not work around it.
2. **Save before big changes**: ask it to "make a backup before changing anything"; if the folder uses Git, commit first.
3. **Keep your keys private**: don't paste passwords or API keys into a chat or into files you'll publish; blur them in screenshots.
4. **Start with small permissions**: plugins start read-only; sending email, publishing, paying and deleting must be confirmed with you first.
5. **Be careful with unknown sources**: download only from official sites; have Claude review other people's skills and MCPs.
6. **Check privacy before publishing**: before anything goes online, have it check for real names, phone numbers, addresses and photos.

**Safety rules you can paste into CLAUDE.md:**

```
## Safety rules
- Before deleting a file, confirm it's the one I want deleted. Always move it to the Trash; never delete permanently.
- Before changing, moving or deleting many files, make a backup and tell me how to restore it.
- If a safety rule blocks you, use a reversible approach or ask me in plain words; never work around it.
- Before sending email, publishing, going live, paying or changing permissions, confirm with me in one sentence.
- Never show passwords or API keys in the chat or write them into files that will be public.
- Everyday reading, research and writing files: just do it, no need to ask each time.
```

## FAQ

**Typing `claude` says "command not found"?** Scroll up to the Setup Notes in the install output, run that line, and reopen the terminal.

**`Shift + Enter` sends instead of adding a line?** You're using the built-in Mac Terminal. Switch to cmux.

**A setting change does nothing?** Plugins, shortcuts and fullscreen mode only apply after you **quit Claude and start a new conversation**. Type `/exit`, then `cc`.

**Long pasted text shows as `[Pasted text #1 +20 lines]`?** It's only collapsed for display; the content is complete. Use CotEditor to edit it.

**Installed a plugin but Claude says the tool doesn't exist?** Start a new conversation; type `/mcp` to check its status and choose Authenticate if needed.

**A plugin shows `CONNECTION_CLOSED`?** Usually it can't find Node.js. Tell Claude: "This MCP shows CONNECTION_CLOSED. Please check whether it needs a full path or a PATH setting."

**A login link pasted into the browser fails?** Copying a long link from the terminal can add a line break or space in the middle. Remove it and try again.

**Google asks you to log in again every 7 days?** The "OAuth consent screen" in Google Cloud is still in "Testing". Ask Claude to walk you through switching it to "In production". The warning "Google hasn't verified this app" is normal for an app you made for yourself; click "Advanced → Go to…".

**Google login keeps choosing your work account?** Open the login link in a **private/incognito window**.

**Claude gets worse and forgets what you just said?** Its memory is nearly full. Type `/compact` or start a new conversation.

**It tells you to paste a command yourself?** Reply: "**Please just do it for me.**"

**It forgets things next time?** Say "Write this rule into CLAUDE.md", then open the file and check it's really there.

**It keeps asking for permission?** Press `Shift + Tab` to change permission mode, after installing the safety kit.

**Using up your limits too fast?** Pick a lighter model in `/config`; keep one topic per conversation; the status line can show usage and reset times (every 5 hours and weekly).

**Friends can't open the web tool you sent?** `file:///` links only work on your computer. Deploy it online, or send the HTML file itself for them to open in a browser.

# Grundideen

**Claude Code (kurz CC) = ein KI-Assistent, der auf deinem Computer wohnt und Hände hat.** Er beantwortet nicht nur Fragen, sondern liest deine Dateien, surft im Web, bedient Tools und baut kleine Web-Apps.

## Drei Stufen der KI

| Stufe | Vergleich | Was sie kann | Beispiele |
|---|---|---|---|
| **Chat** | Eine Bibliothek ohne Hände | Du fragst, sie antwortet. Weiß viel, kann aber nichts tun | ChatGPT, Gemini, Claude im Browser |

Bei eigenen GPTs oder Gems ist ein Chat dein „Schreibassistent“ und ein anderer dein „Reiseassistent“, und **in einem neuen Chat ist alles vergessen**. Claude Code bündelt alle Tools und Skills in **einem Assistenten**. Du sprichst einfach mit ihm, und er entscheidet, was er nutzt.

## Drei Stärken

1. **Er kennt dich gut**: Deine Vorlieben, Gewohnheiten und Daten liegen auf deinem eigenen Computer (in einer Datei namens `CLAUDE.md`), und er liest sie zu Beginn jedes Gesprächs.
2. **Unbegrenzter Werkzeugkasten**: Gib ihm die „Schlüssel“ (API-Keys, MCP-Plugins), dann kann er in deinem Gmail, Notion oder WordPress für dich arbeiten.
3. **Er arbeitet nach deiner Methode**: Schreib wiederkehrende Aufgaben als Arbeitsanweisungen auf (sogenannte **Skills**), dann macht er es beim nächsten Mal genauso.

## Kleines Glossar

| Begriff | Einfach erklärt |
|---|---|
| **Terminal** | Das eingebaute Fenster, in das man Befehle auf schwarzem Hintergrund tippt. Mit cmux fühlt es sich wie eine Chat-App an. |
| **CLAUDE.md** | Deine „Bedienungsanleitung“ für Claude: wer du bist, wie man mit dir spricht, deine Regeln. |
| **MCP** | Eine „Steckdose“ für die KI. Steckst du das MCP eines Tools ein, kann die KI dieses Tool bedienen. |
| **API-Key / Token** | Ein „Schlüssel“, den dir ein Dienst gibt. **Wie ein Passwort hüten.** |
| **Skill** | Eine Arbeitsanweisungs-Karte für die KI. |
| **/-Befehl** | Kurzbefehle mit `/` am Anfang, z. B. `/mcp` oder `/config`. |
| **Vibe Coding** | Software bauen, indem man beschreibt, was man will, ohne Code zu schreiben. |
| **Open Source** | Der Code ist öffentlich, jeder kann ihn prüfen und verbessern, meist kostenlos. Transparent, von der Community gepflegt, überlebt auch, wenn eine Firma verschwindet. |
| **Deployen** | Ein Tool von deinem Computer ins Internet stellen, damit andere es per Link öffnen können. |
| **Kontext** | Wie viel Gespräch die KI gleichzeitig „im Kopf“ behält. Ist er fast voll, wird sie schlechter; aufräumen mit `/compact`. |

## Die richtige Einstellung

**1. Akzeptiere, eine Weile schlechter zu werden.** Wie beim Umstieg aufs Zehnfingersystem: Erst bist du langsamer, dann zwei- bis dreimal schneller. Der Wechsel von ChatGPT ins Terminal fühlt sich ein paar Tage holprig an. Das ist normal.

**2. Sei ein „großes Baby“.** Wenn du etwas nicht weißt, frag zuerst Claude, nicht Google. Sagt es „füge diese Zeile in dein Terminal ein“, antworte: „**Mach das bitte direkt für mich.**“

**3. Behandle es wie einen klugen neuen Mitarbeiter.** Wenn etwas schiefgeht, gib nicht auf: Lass es einen anderen Weg probieren. Sag klar, was du willst, **wie ein guter Chef, der niemanden raten lässt**. Die Zeit für Tools, Rechte und Regeln ist eine einmalige Investition.

**4. Erwarte nicht, dass alles beim ersten Mal perfekt ist.** Der richtige Rhythmus: Funktion beschreiben → Claude baut sie → du testest → bei Problemen Screenshot einfügen → es repariert → nächste Funktion beschreiben.

## Was kostet das?

- Claude Code **braucht ein bezahltes Abo** (kostenlose Konten können nur den Web-Chat nutzen). Starte mit **Pro (ca. 20 USD/Monat)** und steig auf Max um, wenn es nicht reicht.
- Wähle beim Anmelden „Claude-Abo-Konto“. **Nicht die nutzungsbasierte API-Abrechnung**; die kann schnell teuer werden.
- Die meisten Plugins sind kostenlos oder haben ein Gratis-Kontingent. Aktuelle Preise auf claude.com.

> Gezeigt auf einem **Mac**; Unterschiede bei Windows sind mit 🪟 markiert. Sobald Claude installiert ist, kannst du einen Satz einfügen und es fast alle weiteren Schritte erledigen lassen.

| # | Was | Wozu |
|---|---|---|
| 1 | Auf der echten Website registrieren und bezahlen | Phishing-Seiten vermeiden |
| 2 | Claude Code installieren | Das Hauptwerkzeug |
| 3 | Das Terminal cmux installieren | Terminal wie eine Chat-App |
| 4 | Projektordner anlegen | Ein eigener Schreibtisch für die KI |
| 5 | CLAUDE.md anlegen | Es kennt dich in jedem Gespräch |
| 6 | `cc`-Kurzbefehl + Vollbildmodus | Mit zwei Buchstaben starten, kein Flackern |

## Schritt 1: Registrieren (Vorsicht vor Phishing)

⚠️ Wenn du bei Google „Claude Code“ suchst, **klicke nie auf Ergebnisse mit „Gesponsert“**. Manche Fälschungen sehen genauso aus und liefern Schadsoftware. Vertraue nur `claude.ai`, `claude.com`, `code.claude.com` und `anthropic.com`.

Registriere dich auf [claude.ai](https://claude.ai) und wechsle zum **Pro-Abo**.

## Schritt 2: Claude Code installieren

1. Öffne die [offizielle Doku](https://code.claude.com/docs/de/overview) und suche „Native Install“.
2. Öffne das Terminal: `⌘ + Leertaste`, „Terminal“ tippen, Enter.
3. Füge den Installationsbefehl von der Seite ein (derzeit `curl -fsSL https://claude.ai/install.sh | bash`; die Website hat Vorrang) und drücke Enter.
4. Danach `claude` tippen und Enter drücken.

**Kommt „command not found“?** Scroll nach oben. In der Ausgabe steht ein Abschnitt **Setup Notes** mit einer weiteren Zeile, die du ausführen sollst. Führe sie aus.

**Erster Start:** Design wählen → **erste Anmeldeoption (Abo-Konto)** wählen → im Browser das Konto bestätigen und autorisieren → dem Ordner vertrauen. Siehst du das Eingabefeld, bist du drin. Probier: „Hallo, was kannst du?“

🪟 Windows: Die Doku hat einen PowerShell-Befehl. Du kannst auch den Code-Tab der **Claude-Desktop-App** nutzen, der sich mit der Maus bedienen lässt (dann kannst du Schritt 3 und 6 überspringen).

## Schritt 3: cmux installieren (ein besseres Terminal)

Das Mac-Terminal ist umständlich: `Shift+Enter` schickt die Nachricht ab statt eine neue Zeile zu machen, und man kann den Cursor nicht per Klick setzen. [cmux](https://cmux.com) (Open Source, kostenlos) löst das:

- `Shift + Enter` macht eine neue Zeile
- `⌘ + T` öffnet einen neuen Tab, so können **mehrere Claudes gleichzeitig verschiedene Aufgaben** erledigen
- Tabs ziehen, um das Fenster nebeneinander zu teilen

Installation: Mac-Version herunterladen → in „Programme“ ziehen → cmux öffnen → `claude` tippen.

🪟 Windows: cmux gibt es nicht. Nutze das eingebaute Windows Terminal, [WMUX](https://github.com/amirlehmam/wmux) (cmux-Alternative für Windows) oder [Tabby](https://tabby.sh/) (Open Source).

## Schritt 4: Projektordner anlegen

**Starte Claude Code nicht in der obersten Ebene deines Computers.** Gib ihm einen eigenen Schreibtisch: Lege in „Downloads“ oder „Dokumente“ einen Ordner an (z. B. `Mein KI-Agent`), markiere ihn und drücke `⌘ + Option + C`, um den Pfad zu kopieren.

> 💬 Mein Arbeitsordner soll (Pfad einfügen) sein. Bitte wechsle dorthin, und lass uns alle künftigen Arbeiten in diesem Ordner machen.

Tipp: Du kannst **einen Ordner oder ein Bild ins Terminal ziehen**, um den Pfad einzufügen.

## Schritt 5: CLAUDE.md anlegen, damit es sich an dich erinnert

`CLAUDE.md` liegt in deinem Projektordner, und **Claude liest sie zu Beginn jedes neuen Gesprächs**.

**Variante A: Umzug von einer anderen KI.** Füge zuerst das hier in die KI ein, die du bisher genutzt hast (ChatGPT oder Gemini):

> 💬 Bitte fasse alles, was du über mich weißt, in einem Dokument zusammen: wer ich bin, meine Arbeit, Familie, Interessen, wie ich kommunizieren möchte, was ich oft mache, wichtige Regeln und Gewohnheiten. Als Stichpunkte, damit ich es einem anderen KI-Assistenten geben kann.

Dann die Antwort in Claude einfügen:

> 💬 Das hat eine andere KI über mich gelernt. Bitte lege eine CLAUDE.md an, die sich meine Vorlieben merkt: (einfügen)

**Variante B: Lass dich interviewen.**

> 💬 Bitte lege eine CLAUDE.md an, die sich meine Vorlieben merkt. Frag mich nacheinander, was du wissen musst, immer nur eine Frage.

**Vorlage (kopieren und anpassen):**

```
# Meine Vorlieben
- Ich bin (Name), wohne in (Stadt) und arbeite als (…).
- Antworte immer auf Deutsch, einfach und freundlich. Vermeide Fachbegriffe; wenn nötig, erkläre sie in einem Satz.
- Zuerst das Ergebnis, dann die Begründung.
- Ich bin kein Programmierer, also erkläre mit Vergleichen und einfachen Worten.
- Vor wichtigen Aktionen zeig mir einen kurzen Plan und warte auf mein OK.
- Wenn du unsicher bist oder einen besseren Weg kennst, recherchiere online und schlag ihn direkt vor.
- Verwende immer meine Zeitzone (z. B. Europe/Berlin); prüfe das heutige Datum, bevor du mit Daten arbeitest.
```

**Test:** `⌘ + T` für ein neues Gespräch und frag: „Wer bin ich und was mache ich normalerweise?“ Wenn es etwas Neues lernt, sag: „**Schreib das in die CLAUDE.md.**“ Manchmal vergisst es das.

## Schritt 6: `cc`-Kurzbefehl + Vollbildmodus

Ab jetzt bringt dich `cc` in deinen Projektordner und öffnet Claude. Der Vollbildmodus stoppt das Flackern, erlaubt Mausklicks, kopiert markierten Text sofort und lässt dich zurückscrollen.

> 💬 Bitte richte mein Terminal nach diesem Dokument ein: https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/01-terminal-setup.md Mein Projektordner ist (Pfad einfügen). Mach es bitte direkt für mich.

| Tasten | Funktion |
|---|---|
| Mit der Maus markieren | Kopiert automatisch |
| `Ctrl+O`, dann `/` | Im Gespräch suchen |
| `Ctrl+O`, dann `[` | Ganzes Gespräch ausgeben, dann mit `⌘+F` suchen |

## Schritt 7: Sicherheitspaket + Berechtigungsmodus

Es nervt, wenn Claude vor jeder Aktion „Darf ich?“ fragt, aber alles freizugeben fühlt sich riskant an. **Erst ein Sicherheitsnetz, dann die Rechte lockern:**

1. 🗑️ **Gelöschtes landet im Papierkorb**, du bekommst es immer zurück.
2. 🚫 **Sperrliste für gefährliche Befehle**: blockiert Befehle, die man nicht rückgängig machen kann.
3. 🧠 **Arbeitsregeln**: Wird es blockiert, muss es dich fragen statt einen Umweg zu suchen.

> 💬 Ich bin neu bei KI und Programmierung. Bitte prüfe mein Betriebssystem und installiere mir dieses „KI-Sicherheitspaket“: https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/02-safety-kit.md Folge den KI-Anweisungen im Dokument, erkläre alles in einfachem Deutsch und sichere jede Einstellungsdatei, bevor du sie änderst.

| Modus | Einfach erklärt | Gut für |
|---|---|---|
| **Default** | Fragt vor jeder Aktion | Einsteiger, die sehen wollen, was passiert |
| **Plan** | Plant nur; handelt erst nach deiner Freigabe | Überblick vor großen Aufgaben |
| **Accept Edits** | Ändert Dateien ohne Frage, fragt vor Befehlen | Vor allem Programmieren |
| **Auto** | Entscheidet selbst, fragt nur bei Riskantem | **Beste Wahl für die meisten Einsteiger** |
| **Bypass** | Fragt nie | Leute, die genau wissen, was sie tun |

Mit `Shift + Tab` wechselst du den Modus; `/config` zeigt alle Einstellungen (auch das Modell). Bei Pro spart ein leichteres Modell Kontingent; das stärkste Modell ist am klügsten. Im Zweifel: Default.

## Schritt 8: CotEditor für lange Texte

Fügst du einen langen Text ein, schrumpft das Eingabefeld zu `[Pasted text +20 lines]`, und du kannst ihn weder sehen noch bearbeiten.

> 💬 Wenn ich einen langen Text einfüge, fasst das Terminal ihn zu einer Zeile zusammen und ich kann ihn nicht bearbeiten. Ich möchte CotEditor als externen Editor nutzen. Bitte installiere und richte ihn ein.

So geht's: `Ctrl + G` → CotEditor öffnet sich → schreiben, `⌘ + S` speichern, `⌘ + W` schließen → der Text ist wieder im Eingabefeld → Enter.

⚠️ Ein Problem, das wir hatten: Öffnet `Ctrl+G` stattdessen Gemini in Chrome, hat Chrome das Tastenkürzel übernommen. Bitte Claude, den externen Editor auf eine andere Taste zu legen (z. B. `Ctrl+E`). Nach jeder Einstellungsänderung **Claude beenden und ein neues Gespräch starten**.

## Grundlagen

**Claude Code** — der KI-Assistent von Anthropic. Liest und schreibt Dateien, führt Befehle aus, surft im Web und nutzt Plugins. Deine Daten bleiben auf deinem Computer, so lernt er dich mit der Zeit besser kennen. Tipps: ein Thema pro Gespräch; `/compact`, wenn das Gedächtnis fast voll ist; nützlich sind `/mcp`, `/config`, `Shift+Tab` (Berechtigungsmodus wechseln) und `Esc` (unterbrechen).

**cmux** ✓ Open Source — ein Terminal auf Basis von Ghostty, gemacht für KI-Agenten. Tipps: ein Tab fürs Morgen-Briefing, einer für ein Web-Tool, einer für Recherche, alles gleichzeitig; Tab zur Seite ziehen für zwei nebeneinander.

**cc + Vollbild** — `cc` = in den Projektordner wechseln und Claude öffnen. Hinweis: Im Vollbildmodus funktioniert `⌘+F` nicht; nutze `Ctrl+O` und dann `/`.

**CotEditor** ✓ Open Source — ein schlanker Texteditor für den Mac. Aus Claude heraus öffnen, um lange Nachrichten zu schreiben; Emojis und Zeilenumbrüche bleiben erhalten.

## MCP-Plugins: der KI Hände geben

**MCP = eine Steckdose für die KI.** Sicherheitsregel: mit den kleinsten Rechten anfangen, **wo möglich nur lesend**. Nach jeder Installation:

1. **Ein neues Gespräch starten** (alte Gespräche sehen später hinzugefügte Plugins nicht).
2. Claude sagen: „**Aktualisiere die CLAUDE.md mit den Tools, die ich jetzt habe**“, damit es seinen Werkzeugkasten kennt.

Mit `/mcp` siehst du, was installiert ist.

**Firecrawl** ✓ Open Source — viele Seiten (vor allem Facebook und Threads) laden per JavaScript, die KI sieht nur eine leere Hülle. Firecrawl macht daraus sauberen Text. API-Key auf [firecrawl.dev](https://www.firecrawl.dev/); der Gratis-Tarif enthält einige hundert Seiten pro Monat. Zum Beispiel: „Fass diesen Artikel in drei Punkten zusammen“ oder „Vergleiche die Daten auf diesen drei Produktseiten“.

> 💬 Bitte installiere die MCPs Firecrawl und Playwright, damit du soziale Medien und normale Websites lesen kannst. Sag mir, wie ich den API-Key für dich bekomme.

**Playwright** ✓ Open Source (Microsoft) — lässt die KI einen eigenen Browser öffnen, um zu klicken, sich anzumelden, Formulare auszufüllen und Screenshots zu machen, und deine eigenen Web-Tools zu testen. Nutze den **isolierten Modus**: ein sauberer Browser ohne Zugriff auf deine angemeldeten Konten. Lass dich vor dem Absenden eines Formulars fragen.

**Filesystem** ✓ Open Source — erlaubt der KI, einen von dir gewählten Ordner außerhalb des Projekts zu lesen und zu schreiben. Nur den nötigen Ordner öffnen, nie den ganzen Computer.

**Google Workspace** ✓ Open Source (Drittanbieter, nicht von Google) — liest Gmail, Kalender, Drive, Docs und Sheets. Der Schlüssel zum Morgen-Briefing. Du legst in Google Cloud eigene Zugangsdaten an; plane 15–30 Minuten ein und lass dich von Claude Schritt für Schritt führen. Erst **nur lesend**, später mehr freigeben. Zugangsdaten nie in einen Chat einfügen oder weitergeben.

> 💬 Ich möchte, dass du mein Gmail und meinen Google Kalender liest. Bitte folge diesem Dokument, nutze die sicherste Nur-Lesen-Einrichtung und führe mich Schritt für Schritt: https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/03-google-workspace.md

**Notion** — lässt die KI deine Notion-Notizen und Aufgaben lesen. Nach der Installation `/mcp` → notion → Authenticate und die erlaubten Seiten anhaken.

> 💬 Ich möchte, dass du mein Notion liest. Bitte richte es mit dem offiziellen Notion-MCP ein.

**Andere Tools** (WordPress, Figma, Canva …):

> 💬 Ich nutze oft (Name des Tools). Kannst du mir zeigen, wie ich einen API-Key bekomme, damit du es lesen und bearbeiten kannst?

🔑 **Schlüssel sicher aufbewahren**: API-Keys und Tokens in einer Datei namens `.env` speichern. KI-Tools und Entwickler wissen: `.env` wird nie hochgeladen oder veröffentlicht.

## Skills: der KI deine Methoden beibringen

**CLAUDE.md = sich merken, wer du bist. Ein Skill = sich merken, wie etwas gemacht wird.** Ein Skill ist wie eine Arbeitsanweisung für einen neuen Kollegen.

⚠️ **Installiere fremde Skills nicht blind.** Ein Skill ist eine Anweisung, die die KI befolgt. Statt „installiere diesen Skill“ sag lieber: „**Was ist das für ein Skill? Ist er sicher? Passt er zu mir?**“ Bevorzuge offizielle Skills oder GitHub-Projekte mit vielen Sternen.

**Skill Creator** (offiziell, Anthropic) ✓ Open Source — der „Skill zum Bauen von Skills“ und der erste, den du installieren solltest. Beschreibe einen Ablauf, und er schreibt einen gut aufgebauten Skill. [GitHub](https://github.com/anthropics/skills)

**Brainstorming** (Superpowers) ✓ Open Source — geht davon aus, dass du nichts weißt, und **stellt immer nur eine Auswahlfrage**, bis aus einer vagen Idee ein konkreter Plan wird. Ideal für Nicht-Programmierer, die kleine Tools bauen wollen. [GitHub](https://github.com/obra/superpowers)

**UI UX Pro Max** ✓ Open Source — bündelt viele ansprechende Webdesign-Muster. Gut für Privatpersonen ohne Markenrichtlinien; hat deine Firma eigene Farben und Schriften, gib der KI lieber diese. [GitHub](https://github.com/nextlevelbuilder/ui-ux-pro-max-skill)

**Spaß-Skills** (distilly, ex-skill, yourself-skill) — wirken wie Witze, aber Claude kann sie zerlegen, damit du lernst, wie andere Persönlichkeit und Gedächtnis einer KI gestalten. Auch hier: erst von Claude prüfen lassen.

## Mehr Komfort

**Statusline** — die unterste Zeile im Terminal: Modell, **Gedächtnis-Balken**, Nutzungslimit, Uhrzeit. Ab etwa 80 % Gedächtnis wird die KI schlechter; dann `/compact`. Füge einen Screenshot einer Statuszeile ein, die dir gefällt:

> 💬 Ich hätte gern eine Statuszeile wie auf diesem Bild, mit Fortschrittsbalken, verbleibender Nutzung und Reset-Zeit, Farben von Grün bis Rot und (dein Lieblings-Emoji) am Anfang. Bitte bau sie mir.

**Obsidian** — eine Notiz-App für `.md`-Dateien (privat kostenlos, kein Open Source). Öffnest du Claudes Notizen darin, werden Tabellen zu echten Tabellen. Nach der Installation „**Ordner als Vault öffnen**“ wählen und deinen Claude-Projektordner nehmen (nicht „Neuen Vault erstellen“). [obsidian.md](https://obsidian.md)

**Deployen: Cloudflare / Zeabur** — ein Web-Tool von Claude ist eine Datei auf deinem Computer (beginnt mit `file:///`), Freunde können den Link nicht öffnen. Erst nach dem Deployen gibt es eine öffentliche Adresse. Cloudflare Pages passt für einfache Seiten, Zeabur für Tools mit gespeicherten Daten, GitHub Pages ist eine weitere gute Gratis-Option. Vor dem Veröffentlichen auf persönliche Daten prüfen.

> 💬 Ich möchte dieses Tool für Freunde online stellen. Bitte vergleiche Cloudflare Pages, Zeabur und GitHub Pages, sag mir, was passt, und führe mich Schritt für Schritt durch.

**Teile im Hintergrund** (Homebrew, Node.js, uv, jq — alle Open Source): Wenn Claude sagt „wir müssen ____ installieren“, antworte „OK, installiere es für mich“.

# Praxis

> Bisher hast du deinem neuen Kollegen Werkzeuge und Rechte gegeben. Jetzt geht's an die Arbeit. Jede Übung braucht nur eine Beschreibung, keinen Code.

## Übung 1: Einen Artikel aus dem Web lesen (5 Min.)

> 💬 Bitte lies diesen Artikel und gib mir eine Gliederung: (Link einfügen)

Sagt es, es sei blockiert worden, **gib ihm eine zweite Chance**: „Versuch es auf einem anderen Weg.“ Klappt es immer noch nicht, installiere Firecrawl. Fragt es, ob es einer Seite vertrauen soll, wähle bei oft genutzten Seiten „Yes, and don't ask again“.

**Lektion:** Nicht aufgeben, wenn die KI scheitert; wenn es wirklich nicht geht, besorg ihr ein Werkzeug.

## Übung 2: Morgen-Briefing /morning (30 Min.)

Jeden Morgen `/morning` tippen, und es fasst zusammen, was du gestern gemacht hast und was heute am wichtigsten ist. Vorher Google Workspace (und Notion) installieren.

> 💬 Ich möchte, dass du mein Gmail, meinen Google Kalender und Notion liest. Bitte erstelle einen Befehl /morning: Wenn ich ihn nutze, fass den gestrigen Tag und die wichtigsten Aufgaben von heute als Morgen-Briefing zusammen. Sag mir den einfachsten Weg, das einzurichten.

Es führt dich durch die Anmeldung (`/mcp` → Dienst wählen → im Browser anmelden). Vielleicht bietet es mehrere Versionen an; wähle eine und sag „Bitte erstelle sie“. Dann ein neues Gespräch öffnen und `/morning` tippen.

**Besser machen:** Abschnitte nutzen (z. B. Privat/Familie oben, Arbeit unten); bitten: „Sag mir ehrlich, wenn ein Dienst nicht gelesen werden konnte“; das Briefing nur lesend lassen. Später kann es automatisch per E-Mail, LINE oder Discord kommen.

## Übung 3: Bilder automatisch mit einem Skill erzeugen (30 Min.)

Keine Lust mehr, für jeden Artikel oder Wochenbericht in Canva oder Figma Texte von Hand zu ändern? Gib der KI einen **Vorlagen-Screenshot**, lass sie eine HTML-Vorlage daraus machen, und gib ihr danach nur noch den Inhalt.

> 💬 Ich möchte einen Skill erstellen: Wenn ich dir einen Artikel gebe, lies ihn und erstelle ein Titelbild in 1920×1080 im Stil dieser Vorlage (Screenshot einfügen). Bitte baue die Vorlage als HTML-Datei, damit sie schnell zu bearbeiten und zu screenshotten ist.

Falsche Schrift? Nenn ihr den Schriftnamen. Nur Text ändern? Schreib in den Skill „**nur den Text ändern, nie das Layout**“. Passt auch für Wochenberichte, Social-Media-Posts und Veranstaltungsplakate.

> 💬 (Screenshot einer Statuszeile einfügen) Ich hätte gern so eine Statuszeile. Was kann ich anpassen? Am Anfang hätte ich gern 🐶🥐. Bitte bau und aktualisiere sie für mich.

Die Formulierung zählt: Frag nicht „Wie mache ich das?“ (dann erklärt es dir). Sag „**Bitte mach es für mich.**“ Passt es nicht, ergänze Details; sind die Farben matt, sag „Ich möchte einen Verlauf von Grün nach Rot“. **Sei klar wie ein guter Chef.**

## Übung 5: Ein kleines Web-Tool — Angebotsgenerator (30 Min.)

Beim Bearbeiten von Angeboten in Canva zerschießen Kollegen versehentlich Schriften und Layout. Mach einen Screenshot eines bestehenden Angebots und starte ein neues Gespräch:

> 💬 (Screenshot einfügen) Bitte bau ein Web-Tool für Angebote. Links alle Felder zum Ausfüllen, rechts eine Live-Vorschau, die sich beim Tippen aktualisiert. Logo und Stempel gebe ich dir später; nimm vorerst eine Platzhalterfarbe.

Dann jeweils eine Funktion ergänzen:

> 💬 Füge links eine Liste früherer Angebote mit drei Beispiel-Datensätzen hinzu, zwischen denen ich per Klick wechseln kann.

**Vorteile:** Es ist eine einzige HTML-Datei, die du Kollegen schicken kannst, und sie funktioniert offline; man kann nur Felder ausfüllen, also macht niemand das Design kaputt. Fortgeschritten: die Felder direkt aus Angeboten in deinem Gmail füllen lassen. **Grenze:** Einträge werden nur im Browser der jeweiligen Person gespeichert; zum Teilen muss es online gestellt werden.

# Sicherheit & FAQ

## Sicherheitsregeln

Die KI ist klug, aber sie ist ein neuer Kollege mit deinem Hausschlüssel. Vereinbart die Regeln, bevor du Rechte vergibst:

1. **Löschen muss rückgängig machbar sein**: Mit dem Sicherheitspaket landet Gelöschtes im Papierkorb. Wird die KI blockiert, muss sie dich fragen statt einen Umweg zu suchen.
2. **Vor großen Änderungen sichern**: Bitte sie „vor jeder Änderung eine Sicherung zu machen“; nutzt der Ordner Git, vorher committen.
3. **Schlüssel geheim halten**: Passwörter und API-Keys nicht in Chats oder in Dateien einfügen, die du veröffentlichst; in Screenshots unkenntlich machen.
4. **Mit kleinen Rechten anfangen**: Plugins zuerst nur lesend; E-Mails senden, veröffentlichen, bezahlen und löschen müssen vorher mit dir bestätigt werden.
5. **Vorsicht bei unbekannten Quellen**: Nur von offiziellen Seiten herunterladen; fremde Skills und MCPs von Claude prüfen lassen.
6. **Vor dem Veröffentlichen Datenschutz prüfen**: Lass prüfen, ob echte Namen, Telefonnummern, Adressen oder Fotos enthalten sind.

**Sicherheitsregeln zum Einfügen in die CLAUDE.md:**

```
## Sicherheitsregeln
- Bevor du eine Datei löschst, bestätige, dass ich genau diese löschen will. Immer in den Papierkorb verschieben, nie endgültig löschen.
- Bevor du viele Dateien änderst, verschiebst oder löschst, mach eine Sicherung und sag mir, wie ich sie wiederherstelle.
- Blockiert dich eine Sicherheitsregel, nimm einen umkehrbaren Weg oder frag mich in einfachen Worten; umgehe sie nie.
- Vor E-Mails, Veröffentlichungen, Live-Schaltungen, Zahlungen oder Rechteänderungen bestätige mit mir in einem Satz.
- Zeig Passwörter oder API-Keys nie im Chat und schreib sie nicht in öffentliche Dateien.
- Alltägliches Lesen, Recherchieren und Schreiben von Dateien: einfach machen, ohne jedes Mal zu fragen.
```

## FAQ

**`claude` meldet „command not found“?** Scroll in der Installationsausgabe zu den Setup Notes, führe die Zeile aus und öffne das Terminal neu.

**`Shift + Enter` schickt ab statt eine neue Zeile?** Du nutzt das eingebaute Mac-Terminal. Wechsle zu cmux.

**Eine Einstellung wirkt nicht?** Plugins, Kürzel und Vollbildmodus gelten erst, wenn du **Claude beendest und ein neues Gespräch startest**. `/exit` tippen, dann `cc`.

**Langer Text erscheint als `[Pasted text #1 +20 lines]`?** Er ist nur eingeklappt; der Inhalt ist vollständig. Zum Bearbeiten CotEditor nutzen.

**Plugin installiert, aber Claude sagt, das Tool gibt es nicht?** Neues Gespräch starten; mit `/mcp` den Status prüfen und bei Bedarf Authenticate wählen.

**Ein Plugin zeigt `CONNECTION_CLOSED`?** Meist findet es Node.js nicht. Sag Claude: „Dieses MCP zeigt CONNECTION_CLOSED. Bitte prüfe, ob es einen vollständigen Pfad oder eine PATH-Einstellung braucht.“

**Ein in den Browser kopierter Anmeldelink funktioniert nicht?** Beim Kopieren langer Links aus dem Terminal kann in der Mitte ein Zeilenumbruch oder Leerzeichen entstehen. Entfernen und erneut versuchen.

**Google will alle 7 Tage eine neue Anmeldung?** Der „OAuth-Zustimmungsbildschirm“ in Google Cloud steht noch auf „Testen“. Lass dich von Claude durch die Umstellung auf „In Produktion“ führen. Die Warnung „Google hat diese App nicht überprüft“ ist bei einer selbstgebauten App normal; klicke auf „Erweitert → Weiter zu …“.

**Google-Anmeldung wählt immer dein Arbeitskonto?** Öffne den Link in einem **privaten/Inkognito-Fenster**.

**Claude wird schlechter und vergisst, was du gerade gesagt hast?** Das Gedächtnis ist fast voll. `/compact` tippen oder ein neues Gespräch starten.

**Es sagt, du sollst einen Befehl selbst einfügen?** Antworte: „**Mach das bitte direkt für mich.**“

**Beim nächsten Mal hat es etwas vergessen?** Sag „Schreib diese Regel in die CLAUDE.md“ und prüfe dann, ob sie wirklich drinsteht.

**Es fragt ständig um Erlaubnis?** Mit `Shift + Tab` den Berechtigungsmodus wechseln, nachdem das Sicherheitspaket installiert ist.

**Kontingent zu schnell verbraucht?** In `/config` ein leichteres Modell wählen; ein Thema pro Gespräch; die Statuszeile kann Nutzung und Reset-Zeiten anzeigen (alle 5 Stunden und wöchentlich).

**Freunde können dein Web-Tool nicht öffnen?** `file:///`-Links funktionieren nur auf deinem Computer. Stell es online oder schick die HTML-Datei selbst, die sie im Browser öffnen.

# 기본 개념

**Claude Code(줄여서 CC) = 내 컴퓨터에 살면서 손발이 있는 AI 비서.** 질문에 답만 하는 게 아니라, 파일을 읽고 웹을 둘러보고 도구를 다루고 작은 웹 앱도 만들어요.

## AI의 세 단계

| 단계 | 비유 | 할 수 있는 일 | 예시 |
|---|---|---|---|
| **Chat 대화** | 손발 없는 도서관 | 묻고 답하기. 아는 건 많지만 직접 행동은 못 함 | ChatGPT, Gemini, 웹용 Claude |
| **Cowork 협업** | 외부 정리 도우미 | 약간의 권한: 폴더 정리, Gmail 읽기, 엑셀 정리 | Claude 데스크톱 앱의 Cowork |
| **Code 코드** | 개발·디자인·콘텐츠 팀을 거느린 개인 집사 | 설명하면 만들어 줌. 나를 기억하고 내가 준 모든 도구를 사용 | **Claude Code** |

GPTs나 Gems를 쓰면 이 대화창은 "글쓰기 도우미", 저 대화창은 "여행 도우미"인데, **대화창을 바꾸면 다 잊어버려요**. Claude Code는 모든 도구와 스킬을 **한 비서**에게 몰아 줍니다. 그냥 말을 걸면 무엇을 쓸지 스스로 판단해요.

## 세 가지 강점

1. **나를 깊이 이해함**: 내 취향, 습관, 자료가 내 컴퓨터(`CLAUDE.md`라는 파일)에 있고, 대화를 시작할 때마다 먼저 읽어요.
2. **무한한 도구 상자**: "열쇠"(API 키, MCP 플러그인)를 주면 내 Gmail, Notion, WordPress에 들어가 일을 해 줘요.
3. **내 방식대로 일함**: 자주 하는 일을 업무 매뉴얼(**스킬 Skill**)로 적어 두면 다음부터 그 방식대로 해요.

## 미니 용어 사전

| 용어 | 쉬운 설명 |
|---|---|
| **터미널** | 검은 화면에 명령어를 입력하는 기본 창. cmux를 쓰면 채팅 앱처럼 느껴져요. |
| **CLAUDE.md** | Claude에게 주는 "내 사용 설명서": 나는 누구인지, 어떻게 대화하면 좋은지, 규칙은 뭔지. |
| **MCP** | AI의 "콘센트". 어떤 도구의 MCP를 꽂으면 AI가 그 도구를 다룰 수 있어요. |
| **API 키 / 토큰** | 서비스가 발급해 준 "열쇠". **비밀번호처럼 지키세요.** |
| **스킬 (Skill)** | AI에게 주는 업무 매뉴얼 카드. |
| **/ 명령어** | `/`로 시작하는 단축 명령어. 예: `/mcp`, `/config`. |
| **바이브 코딩** | 코드를 쓰지 않고 원하는 것을 말로 설명해 소프트웨어를 만드는 것. |
| **오픈 소스** | 코드가 공개되어 누구나 검사·개선할 수 있고 대개 무료. 투명하고, 커뮤니티가 관리하며, 회사가 사라져도 남아요. |
| **배포** | 내 컴퓨터의 도구를 인터넷에 올려 다른 사람도 링크로 열 수 있게 하는 것. |
| **컨텍스트** | AI가 한 번에 "머릿속에" 담을 수 있는 대화 양. 거의 차면 성능이 떨어지니 `/compact`로 정리하세요. |

## 배울 때의 마음가짐

**1. 잠시 서툴러지는 걸 받아들이세요.** 자판을 보며 치다가 독수리 타법을 버리고 손가락 타자를 배울 때처럼, 처음엔 느려지지만 익숙해지면 두세 배 빨라져요. ChatGPT에서 터미널로 옮기면 며칠은 어색한 게 정상이에요.

**2. "아기"가 되세요.** 모르면 구글보다 Claude에게 먼저 물어보세요. "이 줄을 터미널에 붙여 넣으세요"라고 하면 이렇게 답하세요: "**그냥 직접 해 줘.**"

**3. 똑똑하지만 막 입사한 동료처럼 대하세요.** 틀려도 포기하지 말고 다른 방법으로 다시 해 보게 하세요. 원하는 걸 분명히 말하세요. **추측하게 만들지 않는 좋은 상사처럼요.** 처음에 도구·권한·규칙을 주는 시간은 한 번만 하는 투자예요.

**4. 한 번에 완벽하길 기대하지 마세요.** 올바른 리듬: 기능 설명 → Claude가 만듦 → 직접 써 봄 → 문제가 있으면 스크린샷을 붙여 넣음 → 수정 → 다음 기능 설명.
