## 3단계: cmux 설치 (편한 터미널)

Mac 기본 터미널은 불편해요. `Shift+Enter`로 줄을 바꾸려 하면 그냥 전송되고, 마우스로 커서를 옮길 수도 없어요. [cmux](https://cmux.com)(오픈 소스, 무료)가 이걸 해결해요:

- `Shift + Enter`로 줄 바꿈
- `⌘ + T`로 새 탭 → **여러 Claude가 동시에 다른 일을** 할 수 있음
- 탭을 끌어 화면을 좌우로 나누기

설치: Mac 버전 다운로드 → "응용 프로그램"으로 끌어 넣기 → cmux 실행 → `claude` 입력.

🪟 Windows: cmux는 지원하지 않아요. 기본 Windows Terminal, [WMUX](https://github.com/amirlehmam/wmux)(Windows용 cmux 스타일 앱), [Tabby](https://tabby.sh/)(오픈 소스)를 쓰세요.

## 4단계: 프로젝트 폴더 만들기

**컴퓨터 맨 바깥 폴더에서 Claude Code를 시작하지 마세요.** 전용 책상을 주세요: "다운로드"나 "문서"에 폴더를 만들고(예: `나의 AI 비서`), 선택한 뒤 `⌘ + Option + C`로 경로를 복사하세요.

> 💬 작업 폴더를 (경로 붙여 넣기)로 하고 싶어. 그쪽으로 이동해 주고, 앞으로 모든 작업은 이 폴더에서 하자.

팁: **폴더나 이미지를 터미널로 끌어다 놓으면** 경로가 붙여 넣어져요.

## 5단계: CLAUDE.md 만들기 (나를 기억하게)

`CLAUDE.md`는 프로젝트 폴더에 있고, **Claude는 새 대화를 시작할 때마다 먼저 읽어요.**

**방법 A: 다른 AI에서 이사 오기.** 먼저 예전에 쓰던 AI(ChatGPT나 Gemini)에 이걸 붙여 넣으세요:

> 💬 나에 대해 알고 있는 모든 것을 문서 하나로 정리해 줘: 내가 누구인지, 일, 가족, 관심사, 원하는 대화 방식, 자주 하는 일, 중요한 규칙과 습관. 다른 AI 비서에게 넘길 수 있게 항목별로 써 줘.

그 답을 Claude에 붙여 넣으세요:

> 💬 다른 AI가 나에 대해 정리한 내용이야. 내 취향을 기억하는 CLAUDE.md를 만들어 줘: (붙여 넣기)

**방법 B: 인터뷰받기.**

> 💬 내 취향을 기억하는 CLAUDE.md를 만들어 줘. 필요한 걸 한 번에 하나씩 질문해 줘.

**템플릿 (복사해서 고쳐 쓰세요):**

```
# 나의 작업 선호
- 나는 (이름)이고 (도시)에 살며 (직업)으로 일해.
- 항상 한국어로, 쉽고 친근하게 답해 줘. 전문 용어는 피하고, 꼭 써야 하면 한 줄로 설명해 줘.
- 결론 먼저, 이유는 그다음에.
- 나는 개발자가 아니니 비유와 쉬운 말로 안내해 줘.
- 중요한 작업 전에는 짧은 계획을 보여 주고 내 확인을 기다려 줘.
- 확신이 없거나 더 좋은 방법이 있으면 인터넷에서 찾아보고 바로 제안해 줘.
- 시간은 항상 내 시간대(예: Asia/Seoul)로. 날짜를 다루기 전에 오늘 날짜를 확인해 줘.
```

**확인:** `⌘ + T`로 새 대화를 열고 "나는 누구고 평소에 뭘 해?"라고 물어보세요. 새로운 걸 배울 때마다 "**이거 CLAUDE.md에 적어 줘**"라고 하세요. 가끔 잊어버려요.

## 6단계: `cc` 단축키 + 전체 화면 모드

이제 `cc`만 입력하면 프로젝트 폴더로 가서 Claude가 열려요. 전체 화면 모드는 깜빡임을 없애고, 마우스 클릭이 되고, 글자를 선택하면 바로 복사되고, 스크롤로 되돌아볼 수 있게 해 줘요.

> 💬 이 문서대로 내 터미널을 설정해 줘: https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/01-terminal-setup.md 내 프로젝트 폴더는 (경로 붙여 넣기)야. 직접 해 줘.

| 키 | 기능 |
|---|---|
| 마우스로 드래그 | 자동 복사 |
| `Ctrl+O` 후 `/` | 대화 내용 검색 |
| `Ctrl+O` 후 `[` | 전체 대화를 꺼내 `⌘+F`로 검색 |

## 7단계: 안전 키트 + 권한 모드

Claude가 매번 "해도 될까요?"라고 물으면 귀찮지만, 다 허락하자니 불안하죠. **안전망을 먼저 깔고, 그다음 권한을 푸세요:**

1. 🗑️ **삭제한 파일은 휴지통으로** → 언제든 되살릴 수 있어요.
2. 🚫 **위험 명령어 차단 목록** → 되돌릴 수 없는 명령어를 막아요.
3. 🧠 **작업 규칙** → 막히면 우회하지 말고 나에게 물어보게 해요.

> 💬 나는 AI와 프로그래밍 초보야. 내 운영체제를 확인하고 이 "AI 안전 키트"를 설치해 줘: https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/02-safety-kit.md 문서의 AI 실행 지침대로 직접 설치하고, 쉬운 한국어로 설명해 주고, 설정 파일을 바꾸기 전엔 꼭 백업해 줘.

| 모드 | 쉬운 설명 | 이런 분께 |
|---|---|---|
| **Default** | 모든 작업 전에 물어봄 | 무엇을 하는지 지켜보고 싶은 입문자 |
| **Plan** | 계획만 세우고, 승인 후 실행 | 큰 작업 전에 전체 그림 보기 |
| **Accept Edits** | 파일 수정은 묻지 않고, 명령어 실행은 물어봄 | 주로 코딩 |
| **Auto** | 스스로 판단해 위험한 것만 물어봄 | **대부분의 입문자에게 추천** |
| **Bypass** | 아무것도 묻지 않음 | 무엇을 하는지 정확히 아는 사람 |

`Shift + Tab`으로 모드를 바꾸고, `/config`로 모든 설정(모델 포함)을 볼 수 있어요. Pro에서는 가벼운 모델이 사용량을 아껴 주고, 가장 강한 모델이 가장 똑똑해요. 잘 모르겠으면 Default.

## 8단계: 긴 글 편집기 CotEditor

긴 글을 붙여 넣으면 입력창이 `[Pasted text +20 lines]`로 접혀서 보이지도, 고치지도 못해요.

> 💬 긴 글을 붙여 넣으면 터미널에서 한 줄로 접혀서 편집할 수가 없어. CotEditor를 외부 편집기로 쓰고 싶어. 설치하고 설정해 줘.

사용법: `Ctrl + G` → CotEditor가 열림 → 작성 후 `⌘ + S` 저장, `⌘ + W` 닫기 → 글이 입력창으로 돌아옴 → Enter.

⚠️ 겪었던 문제: `Ctrl+G`를 눌렀는데 Chrome의 Gemini가 뜨면, Chrome이 그 단축키를 가져간 거예요. Claude에게 외부 편집기를 다른 키(예: `Ctrl+E`)로 바꿔 달라고 하세요. 설정을 바꾼 뒤에는 **Claude를 종료하고 새 대화를 시작**해야 적용돼요.

## ✅ 1일차 체크리스트

- `cc`를 입력하면 프로젝트 폴더에서 Claude가 열림
- `Shift + Enter`로 줄 바꿈이 됨
- 새 대화에서 "나는 누구야?"에 답할 수 있음
- 삭제한 파일이 휴지통으로 감
- 사소한 일마다 허락을 구하지 않음
- 단축키로 긴 글 편집기가 열림

## 기본 환경

**Claude Code** — Anthropic이 만든 AI 비서. 파일 읽기·쓰기, 명령어 실행, 웹 검색, 플러그인 연결을 해요. 자료가 내 컴퓨터에 있어서 쓸수록 나를 더 잘 알아요. 팁: 주제 하나에 대화 하나; 기억이 거의 차면 `/compact`; 자주 쓰는 것은 `/mcp`, `/config`, `Shift+Tab`(권한 모드 전환), `Esc`(중단).

**cmux** ✓ 오픈 소스 — Ghostty를 기반으로 AI 에이전트를 위해 만든 터미널. 팁: 한 탭은 아침 브리핑, 한 탭은 웹 도구, 한 탭은 자료 조사를 동시에; 탭을 옆으로 끌면 두 개를 나란히 볼 수 있어요.

**cc + 전체 화면** — `cc` = 프로젝트 폴더로 이동 + Claude 열기. 참고: 전체 화면 모드에서는 `⌘+F`가 안 되니 `Ctrl+O` 후 `/`를 쓰세요.

**CotEditor** ✓ 오픈 소스 — Mac용 가벼운 텍스트 편집기. Claude에서 불러 긴 글을 쓰면 이모지와 줄 바꿈이 그대로 유지돼요.

## MCP 플러그인: AI에게 손발 달아 주기

**MCP = AI의 콘센트.** 안전 원칙: 처음엔 최소 권한, **가능하면 읽기 전용**으로. 설치한 뒤에는 꼭:

1. **새 대화를 여세요** (도중에 설치한 플러그인은 이전 대화에서 안 보여요).
2. Claude에게 "**지금 내가 가진 도구들을 CLAUDE.md에 업데이트해 줘**"라고 하세요. 그래야 자기 무기를 기억해요.

`/mcp`를 입력하면 설치된 목록을 볼 수 있어요.

**Firecrawl** ✓ 오픈 소스 — 많은 웹페이지(특히 Facebook, Threads)는 JavaScript로 불러와서 AI가 빈 껍데기만 봐요. Firecrawl이 깔끔한 글로 바꿔 줘요. [firecrawl.dev](https://www.firecrawl.dev/)에서 API 키를 받으세요. 무료 요금제로 한 달에 수백 페이지를 읽을 수 있어요. 예: "이 글을 세 줄로 요약해 줘", "이 세 제품 페이지의 사양을 비교해 줘".

> 💬 Firecrawl과 Playwright MCP를 설치해 줘. 앞으로 SNS와 일반 웹사이트를 읽을 때 쓸 거야. API 키는 어떻게 받아서 주면 되는지도 알려 줘.

**Playwright** ✓ 오픈 소스 (Microsoft) — AI가 자기 브라우저를 열어 클릭, 로그인, 양식 입력, 스크린샷을 하고, 내가 만든 웹 도구도 테스트해요. **격리 모드**를 쓰세요. 깨끗한 브라우저라 평소 로그인한 계정에는 손대지 못해요. 양식을 제출하기 전엔 묻게 하세요.

**Filesystem** ✓ 오픈 소스 — 프로젝트 밖에 있는, 내가 고른 폴더 하나를 AI가 읽고 쓰게 해요. 필요한 폴더만 열고 컴퓨터 전체는 열지 마세요.

**Google Workspace** ✓ 오픈 소스 (제3자, Google 공식 아님) — Gmail, 캘린더, 드라이브, 문서, 스프레드시트를 읽어요. 아침 브리핑의 핵심이에요. Google Cloud에서 내 인증 정보를 만들어야 하니 15–30분 잡고 Claude의 단계별 안내를 받으세요. 처음엔 **읽기 전용**, 안정되면 하나씩 열어 주세요. 인증 정보는 대화에 붙여 넣거나 남에게 주지 마세요.

> 💬 내 Gmail과 Google 캘린더를 읽게 하고 싶어. 이 문서를 따라 가장 안전한 읽기 전용 방식으로 설정하고, 한 단계씩 안내해 줘: https://github.com/benson8780101-dev/benson8780101-dev.github.io/blob/main/claude-guide/03-google-workspace.md

**Notion** — AI가 Notion 노트와 할 일을 읽게 해요. 설치 후 `/mcp` → notion → Authenticate, 웹에서 읽어도 되는 페이지를 체크하세요.

> 💬 내 Notion을 읽게 하고 싶어. Notion 공식 MCP로 설정해 줘.

**다른 도구** (WordPress, Figma, Canva…):

> 💬 나는 (도구 이름)을 자주 써. 네가 읽고 편집할 수 있게 API 키 받는 법을 알려 줄래?

🔑 **열쇠 보관**: API 키와 토큰은 `.env`라는 파일에 저장하세요. AI와 개발자는 `.env`를 보면 절대 올리거나 공개하면 안 된다는 걸 알아요.

## 스킬: AI에게 내 방식 가르치기

**CLAUDE.md = "내가 누구인지" 기억. 스킬 = "일을 어떻게 하는지" 기억.** 스킬은 새 동료에게 주는 업무 매뉴얼 카드 같은 거예요.

⚠️ **남이 만든 스킬을 무작정 설치하지 마세요.** 스킬은 AI가 따르는 지시문이에요. "이 스킬 설치해 줘" 대신 "**이 스킬이 뭐야? 안전해? 나한테 맞아?**"라고 물으세요. 공식 스킬이나 GitHub 별이 많은 것을 고르세요.

**Skill Creator** (Anthropic 공식) ✓ 오픈 소스 — "스킬을 만드는 스킬"로, 가장 먼저 설치할 스킬이에요. 원하는 작업 흐름을 설명하면 구조가 좋은 스킬을 써 줘요. [GitHub](https://github.com/anthropics/skills)

**Brainstorming** (Superpowers) ✓ 오픈 소스 — 내가 아무것도 모른다고 가정하고 **한 번에 객관식 질문 하나씩** 던지며, 막연한 아이디어를 구체적인 계획으로 만들어 줘요. 작은 도구를 만들고 싶은 비개발자에게 딱이에요. [GitHub](https://github.com/obra/superpowers)

**UI UX Pro Max** ✓ 오픈 소스 — 보기 좋은 웹 디자인 패턴을 많이 모아 둔 스킬. 브랜드 가이드가 없는 개인에게 좋아요. 회사에 정해진 색과 글꼴이 있다면 그걸 AI에게 주세요. [GitHub](https://github.com/nextlevelbuilder/ui-ux-pro-max-skill)

**재미있는 스킬** (distilly, ex-skill, yourself-skill) — 농담처럼 보이지만 Claude에게 분석시키면 다른 사람들이 AI의 성격과 기억을 어떻게 설계하는지 배울 수 있어요. 이것도 먼저 Claude에게 검토받으세요.

## 더 편하게 쓰기

**Statusline 상태 표시줄** — 터미널 맨 아래 줄: 모델, **기억 사용량 막대**, 사용 한도, 시간. 기억이 약 80%를 넘으면 AI가 둔해지니, 거의 차면 `/compact`. 마음에 드는 상태 표시줄 스크린샷을 붙여 넣으세요:

> 💬 이 사진 같은 상태 표시줄을 원해. 진행 막대, 남은 사용량과 초기화 시간, 초록에서 빨강으로 바뀌는 색, 앞에는 (좋아하는 이모지). 직접 만들어 줘.

**Obsidian** — `.md` 파일용 노트 앱(개인 무료, 오픈 소스 아님). Claude가 쓴 노트를 열면 표가 진짜 표로 보여요. 설치 후 "**폴더를 보관함으로 열기(Open folder as vault)**"를 골라 Claude 프로젝트 폴더를 선택하세요("새 보관함 만들기" 아님). [obsidian.md](https://obsidian.md)

**배포: Cloudflare / Zeabur** — Claude가 만든 웹 도구는 내 컴퓨터의 파일(`file:///`로 시작)이라 친구가 링크를 못 열어요. 배포해야 공개 주소가 생겨요. 단순한 페이지는 Cloudflare Pages, 자료를 저장하는 도구는 Zeabur, GitHub Pages도 좋은 무료 선택이에요. 올리기 전에 개인정보가 있는지 확인하세요.

> 💬 이 도구를 친구들이 쓸 수 있게 인터넷에 올리고 싶어. Cloudflare Pages, Zeabur, GitHub Pages를 비교해서 어떤 게 맞는지 알려 주고 단계별로 안내해 줘.

**뒤에서 쓰이는 부품** (Homebrew, Node.js, uv, jq — 모두 오픈 소스): Claude가 "____를 설치해야 해요"라고 하면 "응, 바로 설치해 줘"라고 답하세요.

# 실전 연습

> 지금까지는 새 동료에게 도구와 권한을 줬어요. 이제 일을 맡겨 봐요. 모든 연습은 코드 없이 설명만 하면 돼요.

## 연습 1: 웹에서 글 읽게 하기 (5분)

> 💬 이 글을 읽고 개요를 알려 줘: (링크 붙여 넣기)

막혔다고 하면 **한 번 더 기회를 주세요**: "다른 방법으로 해 봐." 그래도 안 되면 Firecrawl을 설치하세요. "이 사이트를 신뢰할까요?"라고 물으면 자주 쓰는 사이트는 "Yes, and don't ask again"을 고르세요.

**배운 점:** AI가 실패해도 포기하지 말기. 정말 안 되면 도구를 찾아 주기.

## 연습 2: 아침 브리핑 /morning (30분)

매일 아침 `/morning`을 입력하면 어제 한 일과 오늘 가장 중요한 일을 정리해 줘요. 먼저 Google Workspace(와 Notion)를 설치하세요.

> 💬 내 Gmail, Google 캘린더, Notion을 읽어 줬으면 해. /morning 명령어를 만들어 줘. 내가 쓸 때마다 어제 상황과 오늘 중요한 일을 아침 브리핑으로 정리해 줘. 가장 쉬운 설정 방법을 알려 줘.

로그인을 안내해 줄 거예요(`/mcp` → 서비스 선택 → 브라우저에서 로그인). 여러 버전을 보여 주면 하나를 고르고 "만들어 줘"라고 하세요. 새 대화에서 `/morning`을 입력해 보세요.

**더 잘 쓰려면:** 구역을 나누세요(예: 개인/가족은 위, 일은 아래). "읽지 못한 서비스가 있으면 솔직하게 말해 줘"라고 하세요. 브리핑은 읽기만 하게 하세요. 나중엔 이메일, 라인, 디스코드로 자동 발송도 가능해요.

## 연습 3: 스킬로 이미지 자동 생성 (30분)

글이나 주간 보고를 쓸 때마다 Canva나 Figma에서 글자를 하나하나 고치느라 지치셨나요? AI에게 **템플릿 스크린샷**을 주고 HTML 템플릿으로 만들게 한 뒤, 이후엔 내용만 주세요.

> 💬 스킬을 하나 만들고 싶어: 내가 글을 주면 내용을 읽고, 이 템플릿(스크린샷 붙여 넣기) 스타일로 1920×1080 표지 이미지를 만들어 줘. 템플릿은 HTML 파일로 만들어서 나중에 빨리 고치고 캡처할 수 있게 해 줘.

글꼴이 다르면 글꼴 이름을 알려 주세요. 글자만 바꾸고 싶으면 스킬에 "**글자만 바꾸고 레이아웃은 절대 건드리지 마**"라고 적으세요. 주간 보고 카드, SNS 게시물, 행사 포스터에도 좋아요.

## 연습 4: 상태 표시줄 꾸미기 (15분)

> 💬 (상태 표시줄 스크린샷 붙여 넣기) 이런 상태 표시줄을 원해. 뭘 바꿀 수 있어? 앞의 이모지는 🐶🥐로 하고 싶어. 직접 만들어서 적용해 줘.

말하는 방식이 중요해요. "어떻게 해?"라고 물으면 가르쳐 주려고 해요. "**직접 해 줘**"라고 하세요. 다르면 자세히 덧붙이고, 색이 칙칙하면 "초록에서 빨강으로 그라데이션을 원해"라고 하세요. **좋은 상사처럼 분명하게.**

## 연습 5: 작은 웹 도구 — 견적서 생성기 (30분)

Canva로 견적서를 고치다 보면 동료가 실수로 글꼴과 레이아웃을 망가뜨려요. 기존 견적서를 캡처하고 새 대화를 여세요:

> 💬 (스크린샷 붙여 넣기) 견적서 웹 도구를 만들어 줘. 왼쪽엔 입력할 칸 전부, 오른쪽엔 입력하는 대로 바뀌는 실시간 미리보기. 로고와 도장은 나중에 줄 테니 지금은 아무 색으로 채워 줘.

그다음 기능을 하나씩 더하세요:

> 💬 왼쪽에 지난 견적서 목록을 추가하고, 예시 데이터 세 개를 넣어서 클릭하면 바뀌게 해 줘.

> 💬 우리는 회사가 두 개야. 위쪽에 A 회사와 B 회사 정보를 바꾸는 버튼을 추가해 줘.

**장점:** HTML 파일 하나라서 동료에게 보내면 오프라인에서도 써요. 칸만 채울 수 있어서 아무도 디자인을 망가뜨리지 못해요. 고급: Gmail에 온 견적 정보를 칸에 바로 채우게 할 수도 있어요. **한계:** 기록은 각자의 브라우저에만 저장돼요. 함께 쓰려면 배포해야 해요.

## 더 많은 아이디어

| 분야 | 예시 |
|---|---|
| 생활 | 가계부, 여행 공동 경비, 레시피 앱, 장보기 목록 |
| 학습 | 단어 카드, 영상 자막, 독서 노트 |
| 업무 | 팀 대시보드, 회의록, 견적서, 주간 보고 |
| 만들기 | 3D 프린팅 부품 설계, 수리 기록, 부품 가격 비교 |

**아이디어 찾기:** "매주 반복하면서 귀찮은 일이 뭘까?" 그게 AI에게 처음 맡길 일이에요. 서두르지 말고 한 걸음씩.

# 안전과 자주 묻는 질문

## 안전 수칙

AI는 똑똑하지만 "우리 집 열쇠를 든 새 동료"예요. 권한을 주기 전에 규칙부터 정하세요:

1. **삭제는 반드시 되돌릴 수 있게**: 안전 키트를 설치하면 삭제한 건 휴지통으로 가요. 막히면 우회하지 말고 나에게 묻게 하세요.
2. **큰 변경 전엔 저장**: "바꾸기 전에 백업해 줘"라고 하세요. Git을 쓰는 폴더라면 먼저 커밋하세요.
3. **열쇠는 비밀로**: 비밀번호나 API 키를 대화나 공개할 파일에 붙여 넣지 마세요. 스크린샷에서는 가리세요.
4. **권한은 작게 시작**: 플러그인은 읽기 전용부터. 메일 발송, 게시, 결제, 삭제처럼 되돌릴 수 없는 일은 먼저 확인받게 하세요.
5. **출처 모를 것은 조심**: 공식 사이트에서만 내려받고, 남의 스킬과 MCP는 Claude에게 먼저 검토시키세요.
6. **공개 전 개인정보 확인**: 올리기 전에 실명, 전화번호, 주소, 사진이 있는지 확인하게 하세요.

**CLAUDE.md에 바로 넣을 수 있는 안전 수칙:**

```
## 안전 수칙
- 파일을 지우기 전에 내가 지우려는 파일이 맞는지 확인해. 항상 휴지통으로 옮기고 영구 삭제는 하지 마.
- 많은 파일을 바꾸거나 옮기거나 지우기 전에 백업하고, 되돌리는 방법을 알려 줘.
- 안전 규칙에 막히면 되돌릴 수 있는 방법을 쓰거나 쉬운 말로 나에게 물어봐. 절대 우회하지 마.
- 메일 발송, 게시, 공개, 결제, 권한 변경 전에는 한 문장으로 나에게 확인받아.
- 비밀번호나 API 키를 대화에 보여 주거나 공개될 파일에 쓰지 마.
- 평소의 파일 읽기, 자료 조사, 파일 쓰기는 매번 묻지 말고 바로 해.
```

## 자주 묻는 질문

**`claude`를 입력하면 "command not found"?** 설치 메시지의 Setup Notes까지 위로 스크롤해서 그 줄을 실행하고, 터미널을 다시 여세요.

**`Shift + Enter`를 누르면 줄 바꿈 대신 전송돼요?** Mac 기본 터미널을 쓰고 있어서예요. cmux로 바꾸세요.

**설정을 바꿨는데 반응이 없어요?** 플러그인, 단축키, 전체 화면 모드는 **Claude를 종료하고 새 대화를 시작**해야 적용돼요. `/exit` 후 `cc`.

**긴 글이 `[Pasted text #1 +20 lines]`로 보여요?** 접어서 보여 줄 뿐 내용은 전부 있어요. 편집하려면 CotEditor를 쓰세요.

**플러그인을 설치했는데 Claude가 그런 도구가 없대요?** 새 대화를 여세요. `/mcp`로 상태를 보고 필요하면 Authenticate를 고르세요.

**플러그인에 `CONNECTION_CLOSED`가 떠요?** 보통 Node.js를 못 찾아서예요. Claude에게 "이 MCP가 CONNECTION_CLOSED로 나와. 전체 경로나 PATH 설정이 필요한지 확인해 줘"라고 하세요.

**로그인 링크를 브라우저에 붙여 넣으면 실패해요?** 터미널에서 긴 링크를 복사하면 중간에 줄 바꿈이나 공백이 들어갈 수 있어요. 지우고 다시 해 보세요.

**Google이 7일마다 다시 로그인하래요?** Google Cloud의 "OAuth 동의 화면"이 아직 "테스트" 상태예요. Claude에게 "프로덕션"으로 바꾸는 법을 안내받으세요. "Google에서 확인하지 않은 앱" 경고는 직접 만든 앱이라 정상이에요. "고급 → 이동"을 누르세요.

**Google 로그인이 자꾸 회사 계정으로 돼요?** 로그인 링크를 **시크릿 창**에서 여세요.

**Claude가 점점 둔해지고 방금 한 말을 잊어요?** 기억이 거의 찼어요. `/compact`를 입력하거나 새 대화를 여세요.

**명령어를 직접 붙여 넣으라고 해요?** "**그냥 직접 해 줘**"라고 답하세요.

**다음에 또 잊어버려요?** "이 규칙을 CLAUDE.md에 적어 줘"라고 하고, 파일을 열어 정말 적혔는지 확인하세요.

**계속 허락을 구해요?** 안전 키트를 설치한 뒤 `Shift + Tab`으로 권한 모드를 바꾸세요.

**사용량이 너무 빨리 줄어요?** `/config`에서 가벼운 모델을 고르세요. 주제 하나에 대화 하나. 상태 표시줄에 사용량과 초기화 시간(5시간마다, 매주)을 띄울 수 있어요.

**친구가 내가 보낸 웹 도구를 못 열어요?** `file:///` 링크는 내 컴퓨터에서만 열려요. 배포하거나, HTML 파일 자체를 보내 브라우저로 열게 하세요.

## 막혔을 때 쓰는 만능 문장

> 💬 나는 초보인데 여기서 막혔어 (스크린샷 붙여 넣기). 무슨 일인지 쉬운 말로 설명해 주고, 직접 고칠 수 있으면 고쳐 줘.

> 💬 이 설정, 지금도 이렇게 하는 게 맞아? 최신 공식 안내를 인터넷에서 확인해 줘.

> 💬 한 단계씩 안내해 줘. 각 단계가 끝나면 내가 알려 줄 때까지 기다려 줘.

  'zh-CN': { credit: "出处：本指南整理自雷蒙三十（侯智薰）《Claude Code 零基础入门》<a href=\"https://youtu.be/xo7dE80ktu4\">上集</a>、<a href=\"https://youtu.be/80kCvbsuniw\">下集</a>视频与教材，原作采用 CC BY-NC 授权，本页仅供非商业学习分享。", brand: 'Claude Code 新手指南', chapters: '章节', copy: '复制', copied: '已复制', prompt: '发给 Claude', prev: '上一章', next: '下一章', foot: '整理：Benson・2026 年 10 月・仅供免费学习分享' },

  'de': { credit: "Quelle: nach den Videos „Claude Code für Einsteiger“ von Raymond Hou (雷蒙三十) (<a href=\"https://youtu.be/xo7dE80ktu4\">Teil 1</a>, <a href=\"https://youtu.be/80kCvbsuniw\">Teil 2</a>) und seinen Kursunterlagen, lizenziert unter CC BY-NC. Nur für nicht-kommerzielles Lernen geteilt.", brand: 'Claude Code Einstiegshilfe', chapters: 'Kapitel', copy: 'Kopieren', copied: 'Kopiert', prompt: 'In Claude einfügen', prev: 'Zurück', next: 'Weiter', foot: 'Zusammengestellt von Benson · Oktober 2026 · Frei zum Lernen und Teilen' },

};

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

const cache = {};
function chaptersFor(lang) {
  if (cache[lang]) return cache[lang];
  const src = document.getElementById('md-' + lang).textContent;
  const out = [];
  let inFence = false;
  for (const line of src.split('\n')) {
    if (line.startsWith('```')) inFence = !inFence;
    if (!inFence && line.startsWith('# ')) { out.push({ title: line.slice(2).trim(), body: '' }); continue; }
    if (out.length) out[out.length - 1].body += line + '\n';
  }
  cache[lang] = out;
  return out;
}

function pickLang() {
  const h = (location.hash || '').slice(1);
  const fromHash = LANGS.find(l => h.toLowerCase().startsWith(l.id.toLowerCase() + '-') || h.toLowerCase() === l.id.toLowerCase());
  if (fromHash) return fromHash.id;
  const saved = store.get('ccg-lang');
  if (saved && UI[saved]) return saved;
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('zh')) return /cn|sg|hans/.test(nav) ? 'zh-CN' : 'zh-TW';
  if (nav.startsWith('de')) return 'de';
  if (nav.startsWith('ko')) return 'ko';
  return nav.startsWith('en') ? 'en' : 'zh-TW';
}
function pickChapter() {
  const m = (location.hash || '').match(/-(\d+)$/);
  return m ? Math.max(0, parseInt(m[1], 10) - 1) : 0;
}

let state = { lang: pickLang(), ch: pickChapter() };

function enhance(root, ui) {
  root.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div'); w.className = 'tbl';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  root.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  root.querySelectorAll('blockquote').forEach(bq => {
    const txt = bq.textContent.trim();
    if (!txt.startsWith('💬')) return;
    const card = document.createElement('div'); card.className = 'prompt';
    const head = document.createElement('div'); head.className = 'p-head';
    const label = document.createElement('span'); label.className = 'p-label'; label.textContent = ui.prompt;
    const btn = document.createElement('button'); btn.className = 'copy'; btn.type = 'button'; btn.textContent = ui.copy;
    head.append(label, btn);
    const body = document.createElement('div'); body.className = 'p-text';
    body.innerHTML = bq.innerHTML.replace('💬', '').trim();
    body.querySelectorAll('p').forEach(p => p.replaceWith(...p.childNodes));
    card.append(head, body);
    bq.replaceWith(card);
    btn.addEventListener('click', () => {
      const text = body.textContent.trim();
      const ok = () => { btn.textContent = ui.copied; btn.classList.add('done'); setTimeout(() => { btn.textContent = ui.copy; btn.classList.remove('done'); }, 1600); };
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(body); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
      try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
    });
  });
}

function render(scrollTop) {
  const { lang } = state;
  const ui = UI[lang];
  const chs = chaptersFor(lang);
  state.ch = Math.min(state.ch, chs.length - 1);
  document.documentElement.lang = lang;
  document.getElementById('brand').textContent = ui.brand;

  const langs = document.getElementById('langs');
  langs.innerHTML = '';
  LANGS.forEach(l => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = l.label; b.lang = l.id;
    b.setAttribute('aria-pressed', String(l.id === lang));
    b.addEventListener('click', () => { state.lang = l.id; store.set('ccg-lang', l.id); go(); });
    langs.appendChild(b);
  });

  const rail = document.getElementById('rail');
  rail.innerHTML = '<div class="rail-label">' + ui.chapters + '</div>';
  chs.forEach((c, i) => {
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = '<span class="n">' + String(i).padStart(2, '0') + '</span><span></span>';
    b.lastChild.textContent = c.title;
    if (i === state.ch) b.setAttribute('aria-current', 'true');
    b.addEventListener('click', () => { state.ch = i; go(true); });
    rail.appendChild(b);
  });
  const cur = rail.querySelector('[aria-current]');
  if (cur && rail.scrollWidth > rail.clientWidth) rail.scrollLeft = cur.offsetLeft - 16;

  const c = chs[state.ch];
  const art = document.getElementById('content');
  art.innerHTML = '<h1><span class="chap-no">' + String(state.ch).padStart(2, '0') + ' / ' + String(chs.length - 1).padStart(2, '0') + '</span></h1>' + marked.parse(c.body);
  art.querySelector('h1').append(c.title);
  enhance(art, ui);

  const pager = document.getElementById('pager');
  pager.innerHTML = '';
  if (state.ch > 0) pager.appendChild(pagerBtn(ui.prev, chs[state.ch - 1].title, state.ch - 1, 'prev'));
  if (state.ch < chs.length - 1) pager.appendChild(pagerBtn(ui.next, chs[state.ch + 1].title, state.ch + 1, 'next'));
  const foot = document.getElementById('foot');
  foot.textContent = ui.foot;
  if (state.ch === chs.length - 1) {
    const p = document.createElement('p'); p.className = 'credit'; p.innerHTML = ui.credit;
    p.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    foot.appendChild(p);
  }
  if (scrollTop) window.scrollTo({ top: 0 });
}
function pagerBtn(label, title, idx, cls) {
  const b = document.createElement('button'); b.type = 'button'; b.className = cls;
  b.innerHTML = '<small></small><span></span>';
  b.firstChild.textContent = (cls === 'prev' ? '← ' : '') + label + (cls === 'next' ? ' →' : '');
  b.lastChild.textContent = title;
  b.addEventListener('click', () => { state.ch = idx; go(true); });
  return b;
}
function go(scrollTop) {
  const h = '#' + state.lang + '-' + (state.ch + 1);
  try { history.replaceState(null, '', h); } catch (e) {}
  render(scrollTop);
}
window.addEventListener('hashchange', () => { state = { lang: pickLang(), ch: pickChapter() }; render(true); });
render(false);
</script>
